name: Release

# Every push packages the release assets so packaging breaks surface before a
# tag does; a v* tag also publishes them. Tag only commits that passed the
# plugin release gates.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags let `go build` stamp the release version into the binary.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev
      - name: Build binaries with kernel helper support
        # The .ko must match each host's kernel; bootstrap builds it there.
        run: VEER_KFUNCS_SUPPORT=1 bash release.sh amd64 arm64
      - name: Package release assets
        run: |
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) version="v0.0.0-${GITHUB_SHA::12}" ;;
          esac
          sh scripts/package-release.sh "$version" amd64 arm64
      - name: Check packaged binary
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/release/veer-linux-amd64.tar.gz
          binary="$RUNNER_TEMP/veer-linux-amd64/veer-linux-amd64"
          "$binary" version
          "$binary" version --json | grep -q '"kernel_helper": true'
          (cd dist/release && sha256sum -c sha256sums.txt)
          case "$GITHUB_REF" in
            refs/tags/v*)
              # Go stamps only v0/v1 tags into this module (no /vN path suffix).
              if [ "$("$binary" version | head -n 1)" != "veer $GITHUB_REF_NAME" ]; then
                echo "binary does not report $GITHUB_REF_NAME; use a v0.x or v1.x tag" >&2
                exit 1
              fi
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # Upload as a draft, then publish, so releases/latest never points at
          # a release whose assets are still uploading.
          gh release create "$GITHUB_REF_NAME" dist/release/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          gh release edit "$GITHUB_REF_NAME" --draft=false
