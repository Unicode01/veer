name: Plugin release gates

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev php-cli python3 shellcheck
      - name: Install WebUI browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify deployment scripts
        run: |
          sh scripts/verify-platform-support.sh
          python3 scripts/verify-platform-behavior.py
          python3 scripts/verify-deploy-config-policy.py
          shellcheck -x bootstrap.sh deploy.sh release.sh scripts/*.sh plugins/*/*.sh
          php -l whmcs/forward/forward.php
          php -l whmcs/forward/hooks.php
          php scripts/verify-whmcs-behavior.php
          cc -O2 -Wall -Wextra -Werror scripts/verify-nat-probe.c -o /tmp/veer-nat-probe-test
          /tmp/veer-nat-probe-test
      - name: Audit WebUI dependencies
        run: npm audit --audit-level=high
      - name: Install Go analysis tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Run portable plugin release gate
        run: sh scripts/verify-plugin-release.sh portable
      - name: Run Go static analysis
        run: staticcheck ./...

  core-dataplane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install core dataplane dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 util-linux iputils-ping ethtool
      - name: Run privileged core dataplane matrix
        run: sudo env "PATH=$PATH" sh scripts/verify-plugin-release.sh core-dataplane

  flow-churn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install flow churn dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 util-linux
      - name: Run privileged flow churn gate
        run: |
          sudo env \
            "PATH=$PATH" \
            GOPATH=/tmp/veer-flow-churn-gopath \
            GOMODCACHE=/tmp/veer-flow-churn-gomodcache \
            GOCACHE=/tmp/veer-flow-churn-gocache \
            sh scripts/verify-plugin-release.sh flow-churn

  platform-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:11", "ubuntu:22.04", "rockylinux:9", "fedora:latest", "alpine:3.19"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with distribution dependencies and compiler
        env:
          PLATFORM_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --env VEER_PLATFORM_TEST_CONTAINER=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$(go env GOROOT),target=/opt/veer-go,readonly" \
            "$PLATFORM_IMAGE" sh /src/scripts/verify-distro-build.sh

  platform-runtime:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native dataplane dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 iptables nftables util-linux ethtool
      - name: Build native eBPF and run Linux tests
        run: |
          sh scripts/build-all-ebpf.sh
          go test ./internal/app ./internal/kernelcap ./internal/tproxysetup -count=1
      - name: Verify real deployment unit and namespace persistence
        run: sudo env "PATH=$PATH" bash scripts/verify-service-platform.sh
      - name: Verify native core dataplane
        run: sudo env "PATH=$PATH" sh scripts/verify-plugin-release.sh core-dataplane

  platform-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [alpine, rocky]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install VM and eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage clang llvm linux-libc-dev
      - name: Build guest binaries
        run: |
          sh scripts/build-all-ebpf.sh
          CGO_ENABLED=0 go build -trimpath -o /tmp/veer-vm-binary .
          CGO_ENABLED=0 go test -c -o /tmp/veer-vm.test ./internal/app
      - name: Verify stock kernel, deployment, sandbox and reboot
        run: |
          # The runner user cannot normally open /dev/kvm; use the available KVM device.
          sudo python3 scripts/verify-qemu-platform.py "${{ matrix.profile }}" \
            --binary /tmp/veer-vm-binary --test-binary /tmp/veer-vm.test \
            --output "${RUNNER_TEMP}/veer-vm-logs"
      - name: Preserve VM verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-vm-${{ matrix.profile }}
          path: ${{ runner.temp }}/veer-vm-logs
          retention-days: 14
