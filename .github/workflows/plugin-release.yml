name: Plugin release gates

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev php-cli python3 shellcheck
      - name: Install WebUI browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify deployment scripts
        run: |
          sh scripts/verify-platform-support.sh
          python3 scripts/verify-platform-behavior.py
          python3 scripts/verify-deploy-config-policy.py
          python3 scripts/verify-kernel-module-build.py
          shellcheck -x bootstrap.sh deploy.sh release.sh scripts/*.sh plugins/*/*.sh
          php -l whmcs/forward/forward.php
          php -l whmcs/forward/hooks.php
          php scripts/verify-whmcs-behavior.php
          cc -O2 -Wall -Wextra -Werror scripts/verify-nat-probe.c -o /tmp/veer-nat-probe-test
          /tmp/veer-nat-probe-test
          cc -O2 -Wall -Wextra -Werror scripts/verify-flow-time.c -o /tmp/veer-flow-time-test
          /tmp/veer-flow-time-test
      - name: Audit WebUI dependencies
        run: npm audit --audit-level=high
      - name: Install Go analysis tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Run portable plugin release gate
        run: sh scripts/verify-plugin-release.sh portable
      - name: Run Go static analysis
        run: staticcheck ./...

  core-dataplane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install core dataplane dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 util-linux iputils-ping ethtool
      - name: Run privileged core dataplane matrix
        run: sudo env "PATH=$PATH" sh scripts/verify-plugin-release.sh core-dataplane

  privileged:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install privileged plugin and PPPoE dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang llvm linux-libc-dev iproute2 util-linux iputils-ping ethtool nftables tcpdump ppp pppoe iperf3 curl procps
      - name: Load PPP kernel modules
        run: |
          # Cloud runner kernels may ship the PPP drivers only in the extra modules package.
          if ! sudo modprobe -a ppp_generic pppoe; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe -a ppp_generic pppoe
          fi
      - name: Run privileged plugin integration and PPPoE blackbox
        run: |
          sudo env \
            "PATH=$PATH" \
            GOPATH=/tmp/veer-privileged-gopath \
            GOMODCACHE=/tmp/veer-privileged-gomodcache \
            GOCACHE=/tmp/veer-privileged-gocache \
            sh scripts/verify-plugin-release.sh privileged

  flow-churn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install flow churn dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 util-linux
      - name: Run privileged flow churn gate
        run: |
          sudo env \
            "PATH=$PATH" \
            GOPATH=/tmp/veer-flow-churn-gopath \
            GOMODCACHE=/tmp/veer-flow-churn-gomodcache \
            GOCACHE=/tmp/veer-flow-churn-gocache \
            sh scripts/verify-plugin-release.sh flow-churn

  platform-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:11", "ubuntu:22.04", "rockylinux:9", "fedora:latest", "alpine:3.19"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build with distribution dependencies and compiler
        env:
          PLATFORM_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --env VEER_PLATFORM_TEST_CONTAINER=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$(go env GOROOT),target=/opt/veer-go,readonly" \
            "$PLATFORM_IMAGE" sh /src/scripts/verify-distro-build.sh

  platform-runtime:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native dataplane dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 iptables nftables util-linux ethtool wireguard-tools iputils-ping
      - name: Build native eBPF and run Linux tests
        run: |
          sh scripts/build-all-ebpf.sh
          go test ./internal/app ./internal/kernelcap ./internal/tproxysetup -count=1
      - name: Verify opt-in WireGuard WAN and core NAT
        run: sudo env "PATH=$PATH" VEER_RUN_WIREGUARD_TESTS=1 go test ./internal/app -run '^TestVPNWireGuardLinuxIntegration$' -count=1 -v -timeout=5m
      - name: Verify real deployment unit and namespace persistence
        run: sudo env "PATH=$PATH" bash scripts/verify-service-platform.sh
      - name: Verify native core dataplane
        run: sudo env "PATH=$PATH" sh scripts/verify-plugin-release.sh core-dataplane

  vpn-cores:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install VPN integration dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev iproute2 util-linux wireguard-tools iputils-ping ethtool curl
      - name: Build packet adapters
        run: sh scripts/build-all-ebpf.sh
      - name: Verify real Mihomo and sing-box WANs and managed process lifecycle
        run: sudo env "PATH=$PATH" sh scripts/verify-vpn-cores.sh

  platform-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [alpine, rocky]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install VM and eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage clang llvm linux-libc-dev
      - name: Build guest binaries
        run: |
          sh scripts/build-all-ebpf.sh
          CGO_ENABLED=0 go build -trimpath -o /tmp/veer-vm-binary .
          CGO_ENABLED=0 go test -c -o /tmp/veer-vm.test ./internal/app
      - name: Verify stock kernel, deployment, sandbox and reboot
        run: |
          # The runner user cannot normally open /dev/kvm; use the available KVM device.
          sudo python3 scripts/verify-qemu-platform.py "${{ matrix.profile }}" \
            --binary /tmp/veer-vm-binary --test-binary /tmp/veer-vm.test \
            --output "${RUNNER_TEMP}/veer-vm-logs"
      - name: Preserve VM verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-vm-${{ matrix.profile }}
          path: ${{ runner.temp }}/veer-vm-logs
          retention-days: 14

  kernel-load-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install VM and eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static clang llvm linux-libc-dev
      - name: Build eBPF objects and the test binary
        run: |
          sh scripts/build-ebpf.sh
          CGO_ENABLED=0 go test -c -o /tmp/veer-kernel-load.test ./internal/app
      - name: Load the embedded eBPF collections on distribution kernels
        run: |
          # The runner user cannot normally open /dev/kvm; use the available KVM device.
          sudo python3 scripts/verify-kernel-load-matrix.py --test-binary /tmp/veer-kernel-load.test \
            --output "${RUNNER_TEMP}/kernel-load-logs"
      - name: Preserve kernel load logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-load-matrix
          path: ${{ runner.temp }}/kernel-load-logs
          retention-days: 14

  optional-kernel-module:
    strategy:
      fail-fast: false
      matrix:
        # Run both until 26.04 passes. host_checks are the packet checks the
        # runner itself may run: the non-linear ones crash the ubuntu-26.04
        # runner's kernel (7.0.0-1019-azure) or are not yet shown safe there,
        # so there they only run in the guest steps.
        include:
          - os: ubuntu-24.04
            host_checks: all
          - os: ubuntu-26.04
            host_checks: setup,ping,udp,malformed,gro,throughput
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install matching kernel build and network test dependencies
        run: sudo apt-get update && sudo apt-get install -y linux-headers-$(uname -r) build-essential clang llvm pahole kmod iproute2 util-linux iputils-ping ethtool wireguard-tools iperf3 curl tcpdump
      # One step per phase: GitHub keeps each step's start and end time even
      # when the runner stops responding and the job's log is lost.
      - name: Build the module, eBPF objects and test binaries
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" sh scripts/verify-kernel-module.sh build
      # Diagnostic: QEMU guests boot this runner's own kernel and run the
      # non-linear PPPoE check, so a kernel crash stops a guest instead of the
      # runner and its console stays here. 7.0.0-1019-azure (26.04) oopses
      # when tc_tunnel is called as a function and then tail-calls; attached
      # and tail-called are how Veer runs it.
      - name: Install the guest tools
        continue-on-error: true
        run: sudo apt-get install -y virtme-ng qemu-system-x86
      - name: Non-linear PPPoE frames, plain BPF, in a guest, tc_tunnel attached
        continue-on-error: true
        run: sudo env "PATH=$PATH" VEER_GUEST_TIMEOUT=180 sh scripts/verify-kfuncs-guest.sh "$RUNNER_TEMP/kmod/loader" --mode bpf --checks nonlinear-attached
      - name: Non-linear PPPoE frames, plain BPF, in a guest, tc_tunnel tail-called
        continue-on-error: true
        run: sudo env "PATH=$PATH" VEER_GUEST_TIMEOUT=180 sh scripts/verify-kfuncs-guest.sh "$RUNNER_TEMP/kmod/loader" --mode bpf --checks nonlinear-tailcalled
      - name: Non-linear PPPoE frames, plain BPF, in a guest, tc_tunnel called as a function
        continue-on-error: true
        run: sudo env "PATH=$PATH" VEER_GUEST_TIMEOUT=180 sh scripts/verify-kfuncs-guest.sh "$RUNNER_TEMP/kmod/loader" --mode bpf --checks nonlinear
      # One check per step, each on a fresh topology, with the module not
      # loaded: 26.04 stopped responding in the non-linear one.
      - name: PPPoE plain BPF, module not loaded, setup only
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=setup sh scripts/verify-kernel-module.sh packets-bpf
      - name: PPPoE plain BPF, module not loaded, ping
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=ping sh scripts/verify-kernel-module.sh packets-bpf
      - name: PPPoE plain BPF, module not loaded, UDP echo and TCP
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=udp sh scripts/verify-kernel-module.sh packets-bpf
      - name: PPPoE plain BPF, module not loaded, malformed frames
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=malformed sh scripts/verify-kernel-module.sh packets-bpf
      - name: PPPoE plain BPF, module not loaded, non-linear frames through a NAPI-frags tap
        if: matrix.host_checks == 'all'
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=nonlinear sh scripts/verify-kernel-module.sh packets-bpf
      - name: PPPoE plain BPF, module not loaded, non-linear frames, tc_tunnel attached and tail-called
        if: matrix.host_checks == 'all'
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=nonlinear-attached,nonlinear-tailcalled sh scripts/verify-kernel-module.sh packets-bpf
      - name: PPPoE plain BPF, module not loaded, throughput
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=throughput sh scripts/verify-kernel-module.sh packets-bpf
      - name: Load the module
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" sh scripts/verify-kernel-module.sh load
      - name: Module tests
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" sh scripts/verify-kernel-module.sh module
      - name: PPPoE packets through the plugin loader, kfuncs
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=${{ matrix.host_checks }} sh scripts/verify-kernel-module.sh packets-kfuncs
      - name: PPPoE packets and TC NAT through Veer
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" VEER_PACKET_CHECKS=${{ matrix.host_checks }} sh scripts/verify-kernel-module.sh packets-veer
      - name: WireGuard
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" sh scripts/verify-kernel-module.sh wireguard
      - name: VPN cores on the kfuncs path
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" sh scripts/verify-kernel-module.sh vpn
      - name: Unload the module
        if: always()
        run: sudo env "PATH=$PATH" VEER_KMOD_WORK="$RUNNER_TEMP/kmod" sh scripts/verify-kernel-module.sh unload
      - name: Kernel log
        if: always()
        run: sudo dmesg | tail -n 200
