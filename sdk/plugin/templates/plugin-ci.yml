name: Veer plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VEER_REPOSITORY: Unicode01/veer
  VEER_REF: main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Check out Veer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VEER_REPOSITORY }}
          ref: ${{ env.VEER_REF }}
          path: veer-source
      - uses: actions/setup-go@v5
        with:
          go-version-file: veer-source/go.mod
          cache-dependency-path: veer-source/go.sum
      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev python3
      - name: Build Veer and plugin SDK
        run: |
          cd veer-source
          VEER_BUILD_PLUGIN_BUNDLE=0 bash ./release.sh amd64
          tar -xzf veer-plugin-sdk.tar.gz -C "${GITHUB_WORKSPACE}"
      - name: Verify plugin
        env:
          VEER_BIN: ${{ github.workspace }}/veer-source/veer-linux-amd64
        run: sh veer-plugin-sdk/sdk/plugin/ci/verify.sh plugin
