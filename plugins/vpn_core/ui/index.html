<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VPN</title></head>
<body><script>
(function () {
  var host = window.VeerPluginHost;
  if (!host) { document.body.textContent = 'VeerPluginHost unavailable'; return; }
  Promise.all([host.assets.style('style.css'), host.assets.script('i18n.js'), host.assets.script('model.js'), host.assets.script('share.js')])
    .then(function () { return host.assets.script('app.js'); })
    .catch(function (error) { host.toastError(error); });
})();
</script></body></html>
