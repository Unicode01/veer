[package]
name = "veer-plugin-vpn-core"
version = "0.13.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Opt-in VPN WAN adapters for kernel WireGuard, Mihomo, sing-box and external TUN cores"

[lib]
name = "vpn_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin" }
serde_json.workspace = true

[dev-dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin", features = ["testing"] }
