<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPN</title>
  <style>
    .wg-page { padding:8px; }
    .wg-fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .wg-page textarea.wg-json { min-height:260px; font-family:ui-monospace,monospace; tab-size:2; }
    .wg-output { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; }
    .wg-actions { display:flex; flex-wrap:wrap; gap:8px; }
    @media(max-width:600px) { .wg-fields { grid-template-columns:1fr; } .wg-actions button { flex:1; } }
  </style>
</head>
<body>
<script>
(function () {
  'use strict';
  const F = window.VeerPluginHost;
  if (!F) { document.body.textContent = 'VeerPluginHost unavailable'; return; }
  let busy = false;
  const controls = [];
  const h = F.h;
  function input(value, type) { return h('input', {className:F.classes.input, attrs:{value:value || '', type:type || 'text'}}); }
  function field(label, control) { return h('label', {className:F.classes.field}, [h('span', {text:label}), control]); }
  function button(label, task, secondary) {
    const b = F.button(label, async function () {
      if (busy) return;
      busy = true; controls.forEach(function (c) { c.disabled = true; });
      try { await task(); }
      catch (e) { F.toastError(e); }
      finally { busy = false; controls.forEach(function (c) { c.disabled = false; }); F.requestResize(); }
    }, secondary);
    controls.push(b); return b;
  }
  const key = input('default');
  const secretName = input('');
  const privateKey = input('', 'password'); privateKey.autocomplete = 'new-password';
  const editor = h('textarea', {className:F.classes.input + ' wg-json', attrs:{spellcheck:'false', 'aria-label':'VPN 出口配置'}});
  const coreEditor = h('textarea', {className:F.classes.input + ' wg-json', attrs:{spellcheck:'false', 'aria-label':'代理核心 JSON 配置'}});
  const output = h('pre', {className:'wg-output', text:'尚未加载'});
  const picker = h('select', {className:F.classes.input, attrs:{'aria-label':'已保存隧道'}});
  const coreDriver = h('select', {className:F.classes.input, attrs:{'aria-label':'管理核心'}}, [
    h('option', {attrs:{value:'mihomo'}, text:'Mihomo'}), h('option', {attrs:{value:'sing_box'}, text:'sing-box'})]);
  const coreVersion = input(''); coreVersion.placeholder = '留空：最新稳定版';
  const coreDigest = input(''); coreDigest.placeholder = '通常留空，自动读取官方 SHA256';
  const installedVersion = h('select', {className:F.classes.input, attrs:{'aria-label':'已安装核心版本'}});
  const coreOutput = h('pre', {className:'wg-output', attrs:{'aria-live':'polite'}, text:'正在读取核心状态…'});
  let corePoll = null, coreSequence = 0;
  controls.push(key, secretName, privateKey, editor, coreEditor, picker);
  controls.push(coreDriver, coreVersion, coreDigest, installedVersion);
  function showCoreStatus(status) {
    const selectedVersion = installedVersion.value;
    installedVersion.replaceChildren(h('option', {attrs:{value:''}, text:'选择已安装版本'}));
    (status.versions || []).forEach(function (v) {
      installedVersion.appendChild(h('option', {attrs:{value:v.version}, text:v.version + (v.version === status.version ? '（默认）' : '')}));
    });
    installedVersion.value = (status.versions || []).some(v => v.version === selectedVersion) ? selectedVersion : status.version || '';
    const lines = ['默认版本：' + (status.version || '尚未安装'), '上一版本：' + (status.previous || '无')];
    if (status.directory) lines.push('核心目录：' + status.directory);
    const job = status.install;
    if (job) {
      const phases = {resolving:'正在查询版本', downloading:'正在下载', verifying:'正在校验', ready:'安装成功', failed:'安装失败'};
      lines.push(phases[job.state] || job.state);
      if (job.downloaded_bytes) lines.push((job.downloaded_bytes / 1048576).toFixed(1) + ' MiB' + (job.total_bytes ? ' / ' + (job.total_bytes / 1048576).toFixed(1) + ' MiB' : ''));
      if (job.error) lines.push(job.error);
    }
    coreOutput.textContent = lines.join('\n'); F.requestResize();
    return job && ['resolving', 'downloading', 'verifying'].includes(job.state);
  }
  async function refreshCore() {
    clearTimeout(corePoll); corePoll = null;
    const sequence = ++coreSequence, driver = coreDriver.value;
    const response = await F.action('core_status', {driver});
    if (sequence !== coreSequence || driver !== coreDriver.value) return;
    const status = response && response.result;
    if (!status) throw new Error('无法读取核心状态');
    if (showCoreStatus(status)) corePoll = setTimeout(function () { refreshCore().catch(F.toastError); }, 1500);
  }
  coreDriver.addEventListener('change', function () { installedVersion.value = ''; refreshCore().catch(F.toastError); });
  window.addEventListener('pagehide', function () { ++coreSequence; clearTimeout(corePoll); });
  function selected() {
    if (!/^[a-z][a-z0-9_]{0,10}$/.test(key.value)) throw new Error('隧道标识使用 1–11 位小写字母、数字或下划线，以字母开头');
    return key.value;
  }
  function preset(mesh) {
    editor.value = JSON.stringify({slot:1, addresses:['10.77.0.1/32'], mtu:1420, listen_port:51820,
      peers:[{public_key:'替换为对端公钥', endpoint:'192.0.2.2:51820', allowed_ips:[mesh ? '192.168.20.0/24' : '0.0.0.0/0'], keepalive:25}],
      remote_routes:[]}, null, 2);
    F.requestResize();
  }
  function corePreset(driver) {
    const config = {driver, slot:1, addresses:['10.78.0.1/32'], mtu:1420};
    if (driver === 'tun') { config.tun_interface = 'tun0'; config.tun_alias = 'my-vpn-provider'; }
    else { config.upstream_interface = 'eth0'; coreEditor.value = JSON.stringify(driver === 'mihomo' ? {mode:'rule', proxies:[], rules:['MATCH,DIRECT']} : {outbounds:[{type:'direct',tag:'direct'}],route:{final:'direct'}}, null, 2); }
    editor.value = JSON.stringify(config,null,2); F.requestResize();
  }
  async function reload() {
    const result = await F.data.list('profiles');
    const records = Array.isArray(result) ? result : result.records || [];
    picker.replaceChildren(h('option', {attrs:{value:''}, text:'选择已保存隧道'}));
    records.forEach(function (record) { picker.appendChild(h('option', {attrs:{value:record.key}, text:record.key})); });
    if (records.some(function (record) { return record.key === key.value; })) picker.value = key.value;
    const statuses = await F.data.list('status');
    output.textContent = JSON.stringify(statuses, null, 2);
  }
  picker.addEventListener('change', async function () {
    if (!picker.value || busy) return;
    const id = picker.value;
    busy = true; controls.forEach(function (c) { c.disabled = true; });
    try {
      const record = await F.data.get('profiles', id);
      key.value = id;
      editor.value = JSON.stringify(record.data, null, 2); privateKey.value = ''; secretName.value = ''; coreEditor.value = '';
    } catch (e) { F.toastError(e); }
    finally { busy = false; controls.forEach(function (c) { c.disabled = false; }); }
    F.requestResize();
  });
  async function storeKey() {
    const value = privateKey.value.trim();
    if (!value) throw new Error('请输入私钥或预共享密钥');
    try {
      const result = await F.action('set_key', {key:selected(), name:secretName.value.trim(), value});
      output.textContent = JSON.stringify(result, null, 2);
      F.toast('密钥已保存');
    } finally { privateKey.value = ''; }
  }
  const page = h('main', {className:F.classes.page + ' wg-page'}, [F.stack([
    F.card([h('h1', {className:F.classes.title, text:'VPN'}),
      h('p', {className:F.classes.description, text:'创建 VPN WAN 后，在 LAN 或出向 NAT 中选择该出口，即可让整个 LAN 或指定下游设备通过隧道访问互联网或远端内网。'}),
      h('p', {className:F.classes.description, text:'支持 WireGuard、Mihomo、sing-box 和外部 TUN。代理核心可在此安装，也可使用本机已有核心。核心故障时暂停该出口。'})]),
    F.card([h('h2', {className:F.classes.title, text:'核心管理'}),
      h('p', {className:F.classes.description, text:'从官方发布下载匹配本机架构的核心，校验通过后设为默认。更新或回滚保留正在运行的出口；重新应用出口后使用新默认版本。填写了 core_path 的出口继续使用指定文件。'}),
      h('div', {className:'wg-fields'}, [field('核心', coreDriver), field('安装版本', coreVersion), field('已安装版本', installedVersion)]),
      h('details', {}, [h('summary', {text:'指定校验值'}), field('SHA256（旧版官方资产无摘要时填写）', coreDigest)]),
      h('div', {className:'wg-actions'}, [
        button('安装 / 更新', async function () { ++coreSequence; clearTimeout(corePoll); await F.action('core_install', {driver:coreDriver.value, version:coreVersion.value.trim(), sha256:coreDigest.value.trim()}); await refreshCore(); F.toast('安装任务已提交'); }),
        button('刷新核心', refreshCore, true),
        button('设为默认', async function () { if (!installedVersion.value) throw new Error('请选择已安装版本'); await F.action('core_select', {driver:coreDriver.value, version:installedVersion.value}); await refreshCore(); F.toast('默认版本已切换，重新应用出口后生效'); }, true),
        button('回滚上一版本', async function () { await F.action('core_rollback', {driver:coreDriver.value}); await refreshCore(); F.toast('默认版本已回滚，重新应用出口后生效'); }, true),
        button('删除所选版本', async function () { if (!installedVersion.value) throw new Error('请选择已安装版本'); await F.action('core_remove', {driver:coreDriver.value, version:installedVersion.value}); await refreshCore(); }, true)
      ]), coreOutput]),
    F.card([h('h2', {className:F.classes.title, text:'出口配置'}),
      h('div', {className:'wg-fields'}, [field('隧道标识', key), field('已保存隧道', picker)]),
      h('div', {className:'wg-actions'}, [button('WireGuard 出口', function () { preset(false); }, true), button('WireGuard 内网', function () { preset(true); }, true), button('Mihomo', function () { corePreset('mihomo'); }, true), button('sing-box', function () { corePreset('sing_box'); }, true), button('外部 TUN', function () { corePreset('tun'); }, true)]),
      h('p', {className:F.classes.description, text:'每个出口使用不同 slot（1–8）。WireGuard 使用 veerwg1，其他核心使用 veervpn1；出向 NAT 源地址填写 addresses 中的 IPv4。upstream_interface 填主机实际上联网口。'}),
      editor, h('div', {className:'wg-actions'}, [
        button('保存草稿', async function () { await F.data.upsert('profiles', selected(), JSON.parse(editor.value), {enabled:true}); await reload(); F.toast('已保存，尚未应用'); }, true),
        button('保存并应用', async function () { const id = selected(); await F.data.upsert('profiles', id, JSON.parse(editor.value), {enabled:true}); await F.action('apply', {key:id}); await reload(); F.toast('已应用'); }),
        button('拆除隧道', async function () {
          if (!await F.confirm({title:'拆除隧道', message:'移除隧道与 WAN 接口。请先把使用此 WAN 的 LAN 或出向 NAT 切换到其他出口。', confirmText:'拆除', cancelText:'取消', danger:true})) return;
          await F.action('teardown', {key:selected()}); await reload();
        }, true)
      ])]),
    F.card([h('h2', {className:F.classes.title, text:'WireGuard 密钥'}), h('div', {className:'wg-fields'}, [field('私钥 / 预共享密钥', privateKey), field('Secret 名称（留空保存本隧道私钥）', secretName)]),
      h('p', {className:F.classes.description, text:'密钥只写入加密 Secret，不会回填。使用预共享密钥时，在 peer 中填写对应 preshared_key_secret。'}), button('保存密钥', storeKey)]),
    F.card([h('h2', {className:F.classes.title, text:'代理核心配置'}), h('p', {className:F.classes.description, text:'Mihomo / sing-box 使用 JSON 格式。节点、规则和 DNS 由对应核心处理；TUN 接入与上联网口由出口配置统一管理。配置加密保存，不会回填；保存后需重新应用出口。'}), coreEditor, button('保存核心配置', async function () { try { await F.action('set_core_config', {key:selected(), value:coreEditor.value}); F.toast('已加密保存，重新应用后生效'); } finally { coreEditor.value = ''; } })]),
    F.card([h('h2', {className:F.classes.title, text:'运行状态'}), h('div', {className:'wg-actions'}, [
      button('刷新状态', reload, true), button('查看核心状态', async function () { output.textContent = JSON.stringify(await F.action('inspect', {key:selected()}), null, 2); }, true),
      button('查看核心日志', async function () { output.textContent = JSON.stringify(await F.action('core_logs', {key:selected()}), null, 2); }, true)]),
      h('p', {className:F.classes.description, text:'核心日志可能包含节点凭据，仅在排障时查看，分享前请自行脱敏。'}), output])
  ])]);
  preset(false); document.body.replaceChildren(page);
  reload().catch(F.toastError).finally(F.requestResize);
  refreshCore().catch(F.toastError);
})();
</script>
</body>
</html>
