[package]
name = "veer-plugin-vtolocal"
version = "1.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "One Linux L3 boundary for host egress and Veer reply injection without a veth peer"

[lib]
name = "vtolocal"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin" }

[dev-dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin", features = ["testing"] }
