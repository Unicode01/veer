<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firewall</title>
  <style>
    /* Firewall */
    .fw-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .fw-actions { flex: 0 0 auto; }
    .fw-banner {
      padding: 12px 16px; border: 1px solid color-mix(in srgb, var(--veer-warn) 30%, transparent);
      border-radius: var(--veer-radius); background: var(--veer-warn-bg); color: var(--veer-text);
    }
    .fw-banner > strong { color: var(--veer-warn); font-weight: 600; }
    .fw-banner p, .fw-banner ul { margin: 4px 0 0; line-height: 1.6; }
    .fw-banner ul { padding-left: 20px; }
    .fw-banner .fw-row { margin-top: 12px; }
    .fw-banner.fw-error { border-color: color-mix(in srgb, var(--veer-danger) 30%, transparent); background: var(--veer-danger-soft); }
    .fw-banner.fw-error > strong { color: var(--veer-danger); }
    .fw-error { margin: 0; color: var(--veer-danger); white-space: pre-wrap; }
    p.fw-error:empty { display: none; }
    .fw-mono { font-family: var(--veer-mono); font-size: var(--veer-fs-sm); }
    .fw-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .fw-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .fw-span { grid-column: 1 / -1; }
    /* Interfaces to bind: one checkbox per interface. */
    .fw-ifaces { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .fw-iface {
      display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 12px;
      border: 1px solid var(--veer-border); border-radius: var(--veer-radius); background: var(--veer-surface);
      color: var(--veer-text); font-size: var(--veer-fs-md); cursor: pointer;
    }
    .fw-iface:has(input:checked) { border-color: var(--veer-border-strong); background: var(--veer-surface-soft); }
    .fw-iface-name { font-family: var(--veer-mono); font-weight: 500; }
    .fw-iface .veer-muted { margin-left: auto; font-size: var(--veer-fs-xs); white-space: nowrap; }
    .fw-switch { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; color: var(--veer-text); font-size: var(--veer-fs-md); cursor: pointer; }
    .fw-limit {
      display: grid; gap: 12px; padding: 16px; border: 1px solid var(--veer-border); border-radius: var(--veer-radius);
    }
    .fw-limit .fw-switch { justify-self: start; }
    .fw-toggle { display: grid; gap: 4px; }
    [hidden] { display: none !important; }
    .fw-state {
      display: inline-flex; align-items: center; gap: 8px; min-height: 22px; padding: 0 8px;
      border-radius: var(--veer-radius-pill); background: var(--veer-success-bg); color: var(--veer-success-text);
      font-size: var(--veer-fs-xs); font-weight: 600; white-space: nowrap;
    }
    .fw-state::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
    .fw-state.is-off { background: var(--veer-off-bg); color: var(--veer-muted); }
    .fw-row-actions { flex-wrap: nowrap; justify-content: flex-end; }
    .fw-counter { font-family: var(--veer-mono); font-size: var(--veer-fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .fw-table .veer-table td:last-child { width: 1%; }
    /* The match column may wrap at its spaces; the other cells stay on one line. */
    .fw-table .veer-table td:has(> .fw-mono) { min-width: 180px; white-space: normal; }
    .fw-empty {
      margin: 0; padding: 16px; border: 1px dashed var(--veer-border-strong);
      border-radius: var(--veer-radius); text-align: center;
    }
    @media (max-width: 720px) {
      .fw-grid, .fw-grid-4 { grid-template-columns: minmax(0, 1fr); }
      .fw-ifaces { grid-template-columns: minmax(0, 1fr); }
      .fw-actions { width: 100%; }
      .veer-card .fw-actions .veer-button { flex: 1 1 0; }
    }
    @media (max-width: 679px) {
      .fw-table .veer-table td:last-child { width: auto; }
      .fw-row-actions { flex-wrap: wrap; }
    }
  </style>
</head>

      global: 'Global counters', g_established: 'replies passed', g_related: 'related ICMP passed', g_essential: 'essential ICMP/DHCP', g_blocklist: 'blocklist drops', g_bogon: 'bogon drops', g_urpf: 'reverse-path drops',
      g_tcp_flags: 'invalid-flag drops', g_fragment: 'fragment drops', g_ct_new: 'connections recorded', g_ct_full: 'recording failed', g_ct_short: 'egress unparsed', g_set_add: 'set additions', g_set_full: 'set additions failed'

  var root = F.h('div', {className: C.page});

  var state = {policies: [], sets: [], settings: {}, status: null, check: null, interfaces: [], editing: null, editingSet: null,
    setRuntime: {}, bans: null, events: []};
  var timerHandle = 0;

  function lines(text) { return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function list(text) { return String(text || '').split(/[\s,]+/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function field(label, input) { return F.h('label', {className: C.field}, [F.h('span', {text: label}), input]); }
  function input(value, attrs) { var el = F.h('input', {className: C.input, attrs: attrs || {}}); el.value = value == null ? '' : value; return el; }
  // Every textarea here holds addresses.
  function textarea(value) { var el = F.h('textarea', {className: C.input + ' veer-mono'}); el.value = value || ''; return el; }
  function mono(el) { el.classList.add('veer-mono'); return el; }
  function checkbox(checked) { var el = F.h('input', {className: C.input, attrs: {type: 'checkbox'}}); el.checked = !!checked; return el; }
  function toggle(box, label, hint) {

      F.h('label', {className: 'fw-switch'}, [box, F.h('span', {text: label})]),
      hint ? F.h('div', {className: C.description, text: hint}) : null
    ]);
  }
  // Relative time, with the absolute time on hover (DESIGN.md §7).
  function timeCell(ms) {
    var locale = document.documentElement.lang === 'en-US' ? 'en-US' : 'zh-CN';
    var seconds = Math.round((ms - Date.now()) / 1000);
    var abs = Math.abs(seconds);
    var unit = abs < 60 ? [seconds, 'second'] : abs < 3600 ? [Math.round(seconds / 60), 'minute'] : abs < 86400 ? [Math.round(seconds / 3600), 'hour'] : [Math.round(seconds / 86400), 'day'];
    var text;
    try { text = new Intl.RelativeTimeFormat(locale, {numeric: 'auto'}).format(unit[0], unit[1]); } catch (e) { text = new Date(ms).toLocaleString(locale); }
    return F.h('span', {text: text, title: new Date(ms).toLocaleString(locale)});
  }
  function select(options, value) {
    var el = F.h('select', {className: C.input});
    options.forEach(function (o) { var opt = F.h('option', {text: o[1], attrs: {value: o[0]}}); el.appendChild(opt); });
    el.value = value;
    return el;
  }
  function setNames() { return state.sets.map(function (s) { return s.key; }); }

  async function load() {
    var results = await Promise.all([
      F.data.list('policies', {limit: 256}),
      F.data.list('settings', {limit: 1}),
      F.action('status', {}).catch(function () { return {}; }),
      F.action('interfaces', {}).catch(function () { return {}; }),
      F.action('check', {}).catch(function () { return {}; }),
      F.action('bans', {limit: 100}).catch(function () { return {}; }),
      F.action('events', {limit: 100}).catch(function () { return {}; }),
      F.data.list('sets', {limit: 256}).catch(function () { return {}; })
    ]);
    state.policies = (results[0].records || []).sort(function (a, b) { return a.key < b.key ? -1 : 1; });
    var s = (results[1].records || [])[0];
    state.settings = s ? s.data : {};
    state.status = results[2].result || null;
    state.interfaces = results[3].result || [];
    state.check = results[4].result || null;
    state.bans = results[5].result || null;
    state.events = results[6].result || [];
    state.sets = (results[7].records || []).sort(function (a, b) { return a.key < b.key ? -1 : 1; });
    render();
  }

  async function refreshStatus() {
    try { state.status = (await F.action('status', {})).result || null; } catch (e) { /* keep the last one */ }
    render();
  }

  function scheduleTick() {
    clearTimeout(timerHandle);
    if (state.status && state.status.pending) timerHandle = setTimeout(refreshStatus, 2000);
  }

  async function apply() {
    var seconds = Number(state.settings.confirm_timeout_seconds || 120);
    var check;
    try {
      check = (await F.action('check', {})).result || {errors: [], warnings: [], token: ''};
    } catch (e) {
      F.toastError(e);
      return;
    }
    state.check = check;
    render();
    if (check.errors.length) {
      F.toastError(t('errorsTitle'));
      return;
    }
    var message = check.warnings.length ? t('applyWithWarnings', {count: check.warnings.length, seconds: seconds}) : t('applyConfirm', {seconds: seconds});
    if (!(await F.confirm({title: t('apply'), message: message, danger: check.warnings.length > 0}))) return;
    F.toast(t('applying'));
    try {
      await F.action('apply', check.token ? {accept_warnings: check.token} : {});
    } catch (e) {
      F.toastError(e);
      await refreshStatus();
      return;
    }
    // A fresh round trip under the new rules proves this page still reaches
    // the API; only then keep them.
    await new Promise(function (resolve) { setTimeout(resolve, 2000); });
    try {
      await F.action('status', {});
      await F.action('confirm', {});
      F.notify(t('confirmed'), 4000, 'success');
    } catch (e) {
      F.toastError(t('confirmFailed'));
    }
    await load();
  }

  async function confirmNow() {
    try { await F.action('confirm', {}); F.notify(t('confirmed'), 4000, 'success'); } catch (e) { F.toastError(e); }
    await load();
  }

  async function rollbackNow() {
    try { await F.action('rollback', {}); F.notify(t('rolledBackNow'), 4000, 'info'); } catch (e) { F.toastError(e); }
    await load();
  }

  var GLOBAL_SHOWN = ['established', 'related', 'essential', 'blocklist', 'bogon', 'urpf', 'tcp_flags', 'fragment', 'ct_new', 'ct_full', 'ct_short', 'set_add', 'set_full'];

  function statusCard() {
    var st = state.status;
    var children = [];
    var toolbar = F.h('div', {className: 'fw-row fw-actions'}, [
      F.button(t('refresh'), load, true),
      F.button(t('apply'), apply, !!(state.status && state.status.pending))
    ]);
    children.push(F.h('div', {className: C.toolbar}, [
      F.h('div', null, [
        F.h('h2', {className: C.title, text: t('title')}),
        F.h('p', {className: C.description, text: t('desc')})
      ]),
      toolbar
    ]));
    var ck = state.check;
    if (ck && (ck.errors.length || ck.warnings.length)) {
      var items = ck.errors.length ? ck.errors : ck.warnings.map(function (w) { return w.message; });
      children.push(F.h('div', {className: 'fw-banner' + (ck.errors.length ? ' fw-error' : '')}, [
        F.h('strong', {text: ck.errors.length ? t('errorsTitle') : t('warningsTitle')}),
        F.h('ul', {}, items.map(function (text) { return F.h('li', {text: text}); }))
      ]));
    }
    if (st) {
      var badges = F.h('div', {className: 'fw-row fw-chips'}, [
        F.badge(t('generation') + ' ' + st.generation),
        F.badge(st.draft_changed ? t('draftChanged') : t('draftSame'))
      ]);
      children.push(badges);
      if (st.pending) {
        children.push(F.h('div', {className: 'fw-banner'}, [
          F.h('strong', {text: t('pendingTitle')}),
          F.h('p', {text: t('pendingBody', {seconds: st.pending.remaining_seconds})}),
          F.h('div', {className: 'fw-row'}, [F.button(t('confirm'), confirmNow), F.button(t('rollback'), rollbackNow, true)])
        ]));
      } else if (st.rolled_back_at && (!st.confirmed_at || st.rolled_back_at > st.confirmed_at)) {
        children.push(F.h('p', {className: C.muted, text: t('rolledBack', {time: new Date(st.rolled_back_at).toLocaleString(), reason: t('reason_' + (st.rollback_reason || 'manual'))})}));
      }
      if (!st.loaded) children.push(F.h('p', {className: C.muted, text: t('notLoaded')}));
      var at = st.attachments;
      var tracking = st.connection_tracking && st.connection_tracking.enabled;
      if (at && at.error) children.push(F.h('p', {className: 'fw-error', text: t('attachFailed') + ': ' + at.error}));
      if (at && at.interfaces.length) {
        children.push(F.h('div', {className: 'fw-row fw-chips'}, at.interfaces.map(function (a) {
          var label = a.error ? t('attachError', {error: a.error}) : !a.attached ? t('attachNone') : a.mode === 'generic' ? t('attachGeneric') : a.mode === 'tc' ? t('attachTC') : t('attachDriver');
          if (tracking && a.attached) label += a.egress ? t('attachEgress') : t('attachEgressMissing');
          return F.badge(a.interface + ': ' + label);
        })));
      }
      if (st.core && st.core.pinned_to_tc) children.push(F.h('p', {className: C.muted, text: t('corePinned')}));
      if (st.last_error) children.push(F.h('p', {className: 'fw-error', text: t('lastError') + ': ' + st.last_error}));
      var stats = [];
      if (st.evasive_drops) stats.push(F.stat(t('evasive'), st.evasive_drops));
      if (st.global) {
        GLOBAL_SHOWN.forEach(function (name) {
          if (st.global[name]) stats.push(F.stat(t('g_' + name), st.global[name]));
        });
      }
      if (stats.length) children.push(F.h('div', {className: C.grid}, stats));
    }
    return F.card(children);
  }

  function settingsCard() {
    var current = state.settings || {};
    var chosen = {};
    (current.interfaces || []).forEach(function (n) { chosen[n] = true; });
    var boxes = state.interfaces.map(function (l) {
      var box = checkbox(chosen[l.name]);
      box.addEventListener('change', function () { chosen[l.name] = box.checked; });
      var note = [l.kind || 'device'];
      if (l.master) note.push('→ ' + l.master);
      if (l.l3) note.push('L3');
      return F.h('label', {className: 'fw-iface'}, [box, F.h('span', {className: 'fw-iface-name', text: l.name}), F.h('span', {className: C.muted, text: note.join(' ')})]);
    });
    (current.interfaces || []).forEach(function (n) {
      if (!state.interfaces.some(function (l) { return l.name === n; })) {
        var box = checkbox(true);
        box.addEventListener('change', function () { chosen[n] = box.checked; });
        boxes.push(F.h('label', {className: 'fw-iface'}, [box, F.h('span', {className: 'fw-iface-name', text: n + ' (?)'})]));
      }
    });
    var trusted = textarea((current.trusted_sources || []).join('\n'));
    var timeout = input(current.confirm_timeout_seconds || 120, {type: 'number', min: 30, max: 600});
    var logRate = input(current.log_per_second === undefined ? 10 : current.log_per_second, {type: 'number', min: 0, max: 1000});
    var available = !state.status || !state.status.connection_tracking || state.status.connection_tracking.available;
    var tracking = checkbox(current.connection_tracking === true);
    tracking.disabled = !available && current.connection_tracking !== true;
    var blocked = {};
    (current.blocklists || []).forEach(function (n) { blocked[n] = true; });
    var blockBoxes = setNames().map(function (name) {
      var box = checkbox(blocked[name]);

      return F.h('label', {className: 'fw-iface'}, [box, F.h('span', {className: 'fw-iface-name', text: name})]);
    });
    (current.blocklists || []).forEach(function (name) {
      if (setNames().indexOf(name) < 0) {
        var box = checkbox(true);
        box.addEventListener('change', function () { blocked[name] = box.checked; });
        blockBoxes.push(F.h('label', {className: 'fw-iface'}, [box, F.h('span', {className: 'fw-iface-name', text: name + ' (?)'})]));
      }
    });
    var base = current.baseline || {};

    }, true);
    return F.card([
      F.h('h3', {className: C.title, text: t('settings')}),
      F.h('div', {className: C.description, text: t('interfacesHint')}),
      state.status && state.status.core && state.status.core.prefers_xdp && !state.status.core.pinned_to_tc
        ? F.h('div', {className: C.description, text: t('corePrefersXDP')}) : null,
      field(t('interfaces'), F.h('div', {className: 'fw-ifaces'}, boxes)),
      F.h('div', {className: 'fw-limit'}, [

        F.h('div', {className: 'fw-grid'}, [field(t('bogon'), bogon), field(t('urpf'), urpf)]),
        toggle(badFlags, t('badFlags')),
        toggle(dropFrags, t('dropFrags'))

        field(t('logRate'), logRate)
      ]),
      F.h('div', {className: C.toolbar}, [save])
    ]);
  }

  function countersFor(key) {
    var st = state.status;
    var item = st && (st.policies || []).find(function (p) { return p.key === key; });
    if (!item || !item.counters) return '—';
    var c = item.counters;
    return [c.pass, c.drop, c.trusted, c.banned || 0, c.rate_limited || 0].join(' / ');
  }

  function limitText(limit) {
    if (!limit) return '—';
    var text = t('limitShort', {max: limit.max_new, window: limit.window_seconds});
    return limit.ban_seconds ? text + ', ' + t('banShort', {ban: limit.ban_seconds}) : text;
  }

  function matchText(d) {
    var protocol = d.protocol || 'tcp';
    var what;
    if (protocol === 'any') what = t('protoAny');
    else if (protocol === 'icmp' || protocol === 'icmpv6') what = protocol + ' ' + ((d.icmp_types || []).join(',') || t('any'));
    else if (protocol === 'ip') what = 'ip ' + (d.ip_protocols || []).join(',');
    else what = protocol + ' ' + (d.ports || []).join(',');
    if (d.tcp_new_only) what += ' (SYN)';
    return what + ((d.destinations || []).length ? ' → ' + d.destinations.join(', ') : '');
  }

  function policyRow(record) {

  }

    var portsField = F.h('div', {className: 'fw-span'}, field(t('ports'), ports));

    var ipField = F.h('div', {className: 'fw-span'}, field(t('ipProtocols'), ipProtocols));
    var anyHint = F.h('div', {className: 'fw-span ' + C.description, text: t('anyHint')});
    var newOnlyBlock = toggle(newOnly, t('newOnly'), t('newOnlyHint'));

    ]);
    function showFor() {

      icmpField.hidden = !(p === 'icmp' || p === 'icmpv6');

        protocol: p,

        field(t('protocol'), protocol),

        field(t('destinations'), dsts),
        field(t('sources'), sources),
        field(t('defaultAction'), def)
      ]),
      newOnlyBlock,
      limitBlock,
      setNames().length ? F.h('div', {className: 'fw-limit'}, [toggle(addOn, t('addToSet'), t('addToSetHint')), addFields]) : null,
      F.h('label', {className: 'fw-switch'}, [enabled, F.h('span', {text: t('enabled')})]),
      error,
      F.h('div', {className: C.toolbar}, [F.button(t('cancel'), function () { state.editing = null; render(); }, true), save])
    ]);
    showFor();
    return card;
  }

  // F.table turns every cell into text; the policy rows hold elements too.
  function cell(tag, value) {
    return F.h(tag, null, [value instanceof Node ? value : (value == null || value === '' ? '—' : String(value))]);
  }
  // roles[i] marks a column as 'status' or 'actions' for the stacked phone layout.
  function nodeTable(headers, rows, roles) {
    roles = roles || [];
    return F.h('div', {className: 'fw-table'}, F.h('table', {className: C.table}, [
      F.h('thead', null, F.h('tr', null, headers.map(function (h) { return cell('th', h); }))),
      F.h('tbody', null, rows.map(function (row) {
        return F.h('tr', null, row.map(function (c, i) {
          var td = cell('td', c);
          if (headers[i]) td.setAttribute('data-label', headers[i]);
          if (roles[i] === 'status') td.className = 'veer-cell-status';
          if (roles[i] === 'actions') td.className = 'veer-cell-actions';
          return td;
        }));
      }))
    ]));
  }

  function policiesCard() {
    var rows = state.policies.map(policyRow);
    var body = rows.length
      ? nodeTable([t('colName'), t('colMatch'), t('colDefault'), t('colSources'), t('colLimit'), t('colCounters'), t('colEnabled'), ''], rows,
        [null, null, null, null, null, null, 'status', 'actions'])
      : F.h('p', {className: C.muted + ' fw-empty', text: t('none')});
    return F.card([
      F.h('div', {className: C.toolbar}, [
        F.h('h3', {className: C.title, text: t('policies')}),
        F.button(t('newPolicy'), function () { state.editing = {key: '', data: {protocol: 'tcp', default_action: 'drop'}, enabled: true}; render(); }, true)
      ]),
      body
    ]);
  }

  // ------------------------------------------------------------------ sets

  function setUsers(name) {
    var users = state.policies.filter(function (p) {
      var d = p.data || {};
      return (d.sources || []).some(function (s) { return s.set === name; }) || (d.add_to_set && d.add_to_set.set === name);
    }).map(function (p) { return (p.data && p.data.name) || p.key; });
    if ((state.settings.blocklists || []).indexOf(name) >= 0) users.unshift(t('usedBlocklist'));
    return users.join('、') || '—';
  }

  function setApplied(name) {
    return !!(state.status && (state.status.sets || []).some(function (s) { return s.key === name; }));
  }

  async function loadRuntime(name) {
    try {
      var result = (await F.action('set_list', {set: name, limit: 256})).result || {items: []};
      state.setRuntime[name] = result;
    } catch (e) {
      state.setRuntime[name] = {items: [], error: F.errorText(e)};
    }
    render();
  }

  function setsCard() {
    var rows = state.sets.map(function (record) {
      var d = record.data || {};
      return [
        F.h('span', {className: 'fw-mono', text: record.key}),
        String((d.elements || []).length),
        setUsers(record.key),
        F.h('div', {className: 'fw-row fw-row-actions'}, [
          F.button(t('edit'), function () { state.editingSet = record; if (setApplied(record.key)) loadRuntime(record.key); else render(); }, true),
          F.button(t('remove'), async function () {
            if (!(await F.confirm({title: t('remove'), message: t('deleteSetConfirm', {name: record.key}), danger: true}))) return;
            try { await F.data.delete('sets', record.key); await load(); } catch (e) { F.toastError(e); }
          }, true)
        ])
      ];
    });
    var body = rows.length
      ? nodeTable([t('colName'), t('colElements'), t('colUsedBy'), ''], rows, [null, null, null, 'actions'])
      : F.h('p', {className: C.muted + ' fw-empty', text: t('setsNone')});
    return F.card([
      F.h('div', {className: C.toolbar}, [
        F.h('h3', {className: C.title, text: t('sets')}),
        F.button(t('newSet'), function () { state.editingSet = {key: '', data: {elements: []}, enabled: true}; render(); }, true)
      ]),
      body
    ]);
  }

  function setEditorCard() {
    var record = state.editingSet;
    var d = record.data || {};
    var key = mono(input(record.key));
    key.disabled = !!record.key;
    var elements = textarea((d.elements || []).join('\n'));
    var error = F.h('p', {className: 'fw-error'});
    var save = F.button(t('save'), async function () {
      var data = {elements: lines(elements.value)};
      try {
        if (record.key) await F.data.update('sets', record.key, data, {enabled: true});
        else await F.data.upsert('sets', key.value.trim(), data);
        state.editingSet = null;
        F.toast(t('saved'));
        await load();
      } catch (e) {
        error.textContent = F.errorText(e);
        F.requestResize();
      }
    }, true);
    var parts = [
      F.h('h3', {className: C.title, text: record.key ? t('edit') + ' ' + record.key : t('newSet')}),
      field(t('setName'), key),
      field(t('setElements'), elements),
      error,
      F.h('div', {className: C.toolbar}, [F.button(t('cancel'), function () { state.editingSet = null; render(); }, true), save])
    ];
    if (record.key) parts.push(runtimeBlock(record.key));
    return F.card(parts);
  }

  function runtimeBlock(name) {
    var parts = [F.h('strong', {text: t('setRuntime')}), F.h('div', {className: C.description, text: t('setRuntimeHint')})];
    if (!setApplied(name)) {
      parts.push(F.h('p', {className: C.muted, text: t('setNotApplied')}));
      return F.h('div', {className: 'fw-limit'}, parts);
    }
    var runtime = state.setRuntime[name] || {items: []};
    var items = (runtime.items || []).filter(function (i) { return i.kind !== 'static'; });
    if (runtime.error) parts.push(F.h('p', {className: 'fw-error', text: runtime.error}));
    parts.push(items.length
      ? nodeTable([t('colSource'), t('colReason'), t('colRemaining'), ''], items.map(function (i) {
        return [
          F.h('span', {className: 'fw-mono', text: i.cidr}),
          t('kind_' + i.kind),
          i.remaining_seconds === null ? '—' : t('remaining', {seconds: i.remaining_seconds}),
          F.button(t('setDel'), async function () {
            try { await F.action('set_del', {set: name, elements: [i.cidr]}); } catch (e) { F.toastError(e); }
            await loadRuntime(name);
          }, true)
        ];
      }), [null, null, null, 'actions'])
      : F.h('p', {className: C.muted + ' fw-empty', text: t('logEmpty')}));
    var addElements = textarea('');
    var addTimeout = input(0, {type: 'number', min: 0, max: 2592000});
    parts.push(F.h('div', {className: 'fw-grid'}, [field(t('setAddElements'), addElements), field(t('setAddTimeout'), addTimeout)]));
    parts.push(F.h('div', {className: C.toolbar}, [
      F.button(t('setFlush'), async function () {
        if (!(await F.confirm({title: t('setFlush'), message: t('setFlushConfirm', {name: name}), danger: true}))) return;
        try { await F.action('set_flush', {set: name}); } catch (e) { F.toastError(e); }
        await loadRuntime(name);
      }, true),
      F.button(t('setAdd'), async function () {
        try {
          await F.action('set_add', {set: name, elements: list(addElements.value), timeout_seconds: Math.floor(Number(addTimeout.value) || 0)});
        } catch (e) { F.toastError(e); }
        await loadRuntime(name);
      }, true)
    ]));
    return F.h('div', {className: 'fw-limit'}, parts);
  }

  async function unban(payload, question) {
    if (question && !(await F.confirm({title: t('unbanAll'), message: question, danger: true}))) return;
    try { await F.action('unban', payload); } catch (e) { F.toastError(e); }
    await load();
  }

  async function moreBans() {
    try {
      var next = (await F.action('bans', {limit: 100, cursor: state.bans.cursor})).result;
      state.bans = {items: state.bans.items.concat(next.items || []), cursor: next.cursor, done: next.done, clock: next.clock};
    } catch (e) { F.toastError(e); }
    render();
  }

  function bansCard() {
    var bans = state.bans;
    var items = bans && bans.items ? bans.items : [];
    var head = F.h('div', {className: C.toolbar}, [F.h('h3', {className: C.title, text: t('bans')})]);
    if (items.length) head.appendChild(F.button(t('unbanAll'), function () { unban({all: true}, t('unbanAllConfirm')); }, true));
    var body = items.length
      ? nodeTable([t('colSource'), t('colPolicy'), t('colRemaining'), ''], items.map(function (b) {
        return [
          F.h('span', {className: 'fw-mono', text: b.source}),
          b.policy_name || b.policy || '—',
          b.remaining_seconds === null ? t('remainingUnknown') : t('remaining', {seconds: b.remaining_seconds}),
          F.button(t('unban'), function () { unban({key: b.key}); }, true)
        ];
      }), [null, null, null, 'actions'])
      : F.h('p', {className: C.muted + ' fw-empty', text: t('bansNone')});
    var parts = [head, body];
    if (bans && !bans.done && bans.cursor) parts.push(F.button(t('more'), moreBans, true));
    return F.card(parts);
  }

  function endpoint(addr, port) {
    if (!addr) return '—';
    return (addr.indexOf(':') >= 0 ? '[' + addr + ']' : addr) + (port ? ':' + port : '');
  }

  function eventTarget(e) {
    if (e.protocol === 'icmp' || e.protocol === 'icmpv6') return e.protocol + ' ' + e.icmp_type + '/' + e.icmp_code + ' ' + endpoint(e.destination, 0);
    if (e.protocol === 'ip') return 'ip ' + e.ip_protocol + ' ' + endpoint(e.destination, 0);
    return (e.protocol ? e.protocol + ' ' : '') + endpoint(e.destination, e.port);
  }

  function logCard() {
    var st = state.status;
    var parts = [F.h('h3', {className: C.title, text: t('dropLog')}), F.h('div', {className: C.description, text: t('dropLogHint')})];
    if (st && st.drop_log) parts.push(F.h('p', {className: C.muted, text: t('logStats', {logged: st.drop_log.logged, lost: st.drop_log.lost})}));
    var events = state.events || [];
    parts.push(events.length
      ? nodeTable([t('colTime'), t('colReason'), t('colIface'), t('colFrom'), t('colTo'), t('colPolicy')], events.map(function (e) {
        return [
          e.at_ms ? timeCell(e.at_ms) : '—',
          t('reasonDrop_' + e.reason),
          F.h('span', {className: 'fw-mono', text: e.interface || '—'}),
          F.h('span', {className: 'fw-mono', text: endpoint(e.source, e.source_port)}),
          F.h('span', {className: 'fw-mono', text: eventTarget(e)}),
          e.set ? '@' + e.set : (e.policy_name || e.policy || '—')
        ];
      }))
      : F.h('p', {className: C.muted + ' fw-empty', text: t('logEmpty')}));
    return F.card(parts);
  }

  function render() {
    root.textContent = '';
    var parts = [statusCard()];
    if (state.editing) parts.push(editorCard());
    parts.push(policiesCard());
    if (state.editingSet) parts.push(setEditorCard());
    parts.push(setsCard(), bansCard(), logCard(), settingsCard());
    root.appendChild(F.stack(parts));
    F.requestResize();
    scheduleTick();
  }

  F.onLocaleChange(render);
  load().catch(function (e) { F.toastError(e); });
})();
</script>
</body>
</html>
