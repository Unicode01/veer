<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firewall</title>
  <style>
    .fw-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .fw-grow { flex: 1 1 220px; min-width: 0; }
    .fw-banner { border-left: 4px solid var(--veer-warning, #d97706); padding: 10px 12px; }
    .fw-error { color: var(--veer-danger, #dc2626); white-space: pre-wrap; }
    .fw-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .fw-ifaces { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
    .fw-iface { display: flex; gap: 6px; align-items: flex-start; }
    textarea.veer-input { min-height: 84px; resize: vertical; }
    .fw-counter { white-space: nowrap; }
  </style>
</head>
<body>
<script>
(function () {
  'use strict';
  var F = window.VeerPluginHost;
  if (!F) { document.body.textContent = 'VeerPluginHost is not available.'; return; }
  var C = F.classes;

  var messages = {
    'zh-CN': {
      title: '防火墙',
      desc: '按目标端口限制来源。规则在 XDP 中执行，排在 Veer 转发之前；保存的是草稿，点"应用"后生效。应用后页面会自动确认；如果新规则挡住了这个页面，截止时间一到就回滚到上一次确认的规则。',
      apply: '应用', confirm: '确认保留', rollback: '立即回滚', refresh: '刷新',
      pendingTitle: '已应用，等待确认', pendingBody: '剩余 {{seconds}} 秒；不确认会回滚到上一次确认的规则。',
      draftChanged: '草稿与已应用的规则不同', draftSame: '草稿已应用',
      rolledBack: '上一次应用在 {{time}} 回滚（{{reason}}）。',
      reason_deadline: '确认超时', reason_manual: '手动', reason_restart: 'Veer 重启时未确认', reason_attach_failed: '挂载失败',
      settings: '设置', interfaces: '挂载接口', interfacesHint: '支持原生 XDP 的物理网卡在驱动收包、分配 skb 之前就丢包；网桥、VLAN 以及 r8169、e1000e 这类没有原生 XDP 的接口改在 TC 入口过滤，排在 Veer 核心之前，不复制数据包。首次启用和全部停用时，部分网卡会短暂断流。',
      trusted: '信任来源（每行一个，始终放行）', timeout: '确认超时（秒）', saveSettings: '保存设置',
      policies: '策略', newPolicy: '新建策略', edit: '编辑', remove: '删除', save: '保存', cancel: '取消',
      name: '名称', protocol: '协议', ports: '端口（逗号分隔，可写区间 1000-2000）', destinations: '目标地址（每行一个，留空表示任意）',
      defaultAction: '未列出的来源', sources: '来源规则（每行"地址 allow|drop"）', enabled: '启用',
      allow: '放行', drop: '丢弃', any: '任意',
      colName: '名称', colMatch: '匹配', colDefault: '默认', colSources: '来源', colCounters: '放行 / 丢弃 / 信任 / 封禁 / 限速', colEnabled: '状态',
      on: '启用', off: '停用', none: '还没有策略。',
      evasive: '规避解析被丢弃的包', notLoaded: '数据面未加载（还没有挂载接口，或正在挂载）',
      generation: '当前代', applying: '应用中…', confirmed: '已应用并确认。', confirmFailed: '无法确认：规则会在截止时间回滚。',
      applyConfirm: '应用草稿？{{seconds}} 秒内未确认会自动回滚。', deleteConfirm: '删除策略 {{name}}？',
      applyWithWarnings: '草稿有 {{count}} 条提示（列在页面上方）。仍然应用？{{seconds}} 秒内未确认会自动回滚。',
      warningsTitle: '应用前请确认', errorsTitle: '草稿有错误，不能应用',
      synLimit: '限制新连接（SYN）', synLimitHint: '同一来源前缀在窗口内最多建立的新 TCP 连接数；超出的 SYN 丢弃，设了封禁时长时，该来源在这条策略上被整个封禁。信任来源不受限制。',
      maxNew: '窗口内最多新连接', windowSeconds: '窗口（秒）', banSeconds: '封禁（秒，0 表示不封禁）', ipv6Prefix: 'IPv6 来源按前缀计数',
      colLimit: '新连接限制', limitShort: '{{max}} 个 / {{window}} 秒', banShort: '封禁 {{ban}} 秒',
      bans: '封禁中的来源', bansNone: '没有封禁中的来源。', unban: '解封', unbanAll: '全部解封', unbanAllConfirm: '解除全部封禁？',
      remaining: '剩余 {{seconds}} 秒', remainingUnknown: '剩余时间未知', more: '更多', colSource: '来源', colPolicy: '策略', colRemaining: '剩余',
      dropLog: '丢包日志（抽样）', dropLogHint: 'XDP 丢弃的包在 tcpdump 和 TC 观察插件里都看不到；在 TC 入口丢弃的包 tcpdump 能看到，但看不出被丢了。排查以这里的计数和日志为准。日志按每个 CPU 每秒限定条数抽样，只保存在内存里，Veer 重启后清空。',
      logEmpty: '还没有记录。', logRate: '丢包日志（每个 CPU 每秒最多条数，0 表示关闭）', logStats: '已记录 {{logged}} 条，ring 满丢失 {{lost}} 条',
      reasonDrop_acl: '规则丢弃', reasonDrop_ban: '封禁中', reasonDrop_rate: '超过新连接限制', reasonDrop_evasive: '规避解析',
      colTime: '时间', colReason: '原因', colIface: '接口', colFrom: '来源', colTo: '目标',
      attachDriver: '已挂载（驱动模式）', attachGeneric: '已挂载（generic 模式）', attachTC: '已挂载（TC）', attachNone: '未挂载', attachError: '挂载失败：{{error}}', attachFailed: '挂载失败',
      corePinned: 'Veer 配置为优先使用 XDP 转发引擎；防火墙挂载期间，核心改走 TC 引擎。',
      corePrefersXDP: 'Veer 配置为优先使用 XDP 转发引擎；防火墙挂载到接口后，核心会改走 TC 引擎，直到防火墙不再挂载。',
      saved: '已保存（草稿）。', rolledBackNow: '已回滚。', lastError: '最近错误'
    },
    'en-US': {
      title: 'Firewall',
      desc: 'Limits sources per destination port. Rules run in XDP ahead of Veer forwarding. Edits are drafts until you apply them. The page confirms an apply by itself; if the new rules cut this page off, the deadline restores the last confirmed rules.',
      apply: 'Apply', confirm: 'Keep', rollback: 'Roll back now', refresh: 'Refresh',
      pendingTitle: 'Applied, waiting for confirmation', pendingBody: '{{seconds}} s left; without confirmation the last confirmed rules come back.',
      draftChanged: 'The draft differs from the applied rules', draftSame: 'Draft applied',
      rolledBack: 'The last apply was rolled back at {{time}} ({{reason}}).',
      reason_deadline: 'not confirmed in time', reason_manual: 'manual', reason_restart: 'unconfirmed when Veer restarted', reason_attach_failed: 'attaching failed',
      settings: 'Settings', interfaces: 'Interfaces', interfacesHint: 'Physical NICs with native XDP drop packets in the driver, before any skb exists. Bridges, VLANs and NICs without native XDP (r8169, e1000e and the like) filter at TC ingress instead, ahead of the Veer core and without copying packets. Some NICs drop the link briefly when the first hook attaches or the last one leaves.',
      trusted: 'Trusted sources (one per line, always pass)', timeout: 'Confirmation timeout (s)', saveSettings: 'Save settings',
      policies: 'Policies', newPolicy: 'New policy', edit: 'Edit', remove: 'Delete', save: 'Save', cancel: 'Cancel',
      name: 'Name', protocol: 'Protocol', ports: 'Ports (comma separated, ranges like 1000-2000)', destinations: 'Destinations (one per line, empty means any)',
      defaultAction: 'Unlisted sources', sources: 'Source rules (one "address allow|drop" per line)', enabled: 'Enabled',
      allow: 'Allow', drop: 'Drop', any: 'any',
      colName: 'Name', colMatch: 'Match', colDefault: 'Default', colSources: 'Sources', colCounters: 'Pass / drop / trusted / banned / limited', colEnabled: 'State',
      on: 'On', off: 'Off', none: 'No policies yet.',
      evasive: 'Packets dropped for evading the parser', notLoaded: 'Dataplane not loaded (no interface bound yet, or attaching)',
      generation: 'Generation', applying: 'Applying…', confirmed: 'Applied and confirmed.', confirmFailed: 'Could not confirm: the rules roll back at the deadline.',
      applyConfirm: 'Apply the draft? Without confirmation within {{seconds}} s it rolls back.', deleteConfirm: 'Delete policy {{name}}?',
      applyWithWarnings: 'The draft has {{count}} warning(s), listed at the top of the page. Apply anyway? Without confirmation within {{seconds}} s it rolls back.',
      warningsTitle: 'Check before applying', errorsTitle: 'The draft has errors and cannot be applied',
      synLimit: 'Limit new connections (SYN)', synLimitHint: 'At most this many new TCP connections per source prefix per window; SYNs over it are dropped and, with a ban time, the whole source is banned from this policy. Trusted sources are never limited.',
      maxNew: 'New connections per window', windowSeconds: 'Window (s)', banSeconds: 'Ban (s, 0 for none)', ipv6Prefix: 'Count IPv6 sources per prefix',
      colLimit: 'New connections', limitShort: '{{max}} per {{window}} s', banShort: 'ban {{ban}} s',
      bans: 'Banned sources', bansNone: 'No source is banned.', unban: 'Unban', unbanAll: 'Unban all', unbanAllConfirm: 'Lift every ban?',
      remaining: '{{seconds}} s left', remainingUnknown: 'time left unknown', more: 'More', colSource: 'Source', colPolicy: 'Policy', colRemaining: 'Left',
      dropLog: 'Drop log (sampled)', dropLogHint: 'Packets dropped in XDP never show up in tcpdump or TC observer plugins; those dropped at TC ingress do show up in tcpdump, with no sign that they were dropped. These counters and this log are the reliable trace. The log is sampled per CPU per second and kept in memory only, so a Veer restart clears it.',
      logEmpty: 'Nothing logged yet.', logRate: 'Drop log (events per CPU per second, 0 turns it off)', logStats: '{{logged}} logged, {{lost}} lost to a full ring',
      reasonDrop_acl: 'rule', reasonDrop_ban: 'banned', reasonDrop_rate: 'over the connection limit', reasonDrop_evasive: 'evading the parser',
      colTime: 'Time', colReason: 'Reason', colIface: 'Interface', colFrom: 'From', colTo: 'To',
      attachDriver: 'attached (driver mode)', attachGeneric: 'attached (generic mode)', attachTC: 'attached (TC)', attachNone: 'not attached', attachError: 'failed: {{error}}', attachFailed: 'Attaching failed',
      corePinned: 'Veer prefers its XDP forwarding engine, but while the firewall is attached the core runs on its TC engine.',
      corePrefersXDP: 'Veer prefers its XDP forwarding engine; once the firewall attaches to an interface the core moves to its TC engine until the firewall detaches.',
      saved: 'Saved (draft).', rolledBackNow: 'Rolled back.', lastError: 'Last error'
    }
  };
  function t(key, params) { return F.t(messages, key, params); }

  var root = F.h('div', {className: C.page});
  document.body.appendChild(root);
  var state = {policies: [], settings: {}, status: null, check: null, interfaces: [], editing: null, bans: null, events: []};
  var timerHandle = 0;

  function lines(text) { return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function field(label, input) { return F.h('label', {className: C.field}, [F.h('span', {text: label}), input]); }
  function input(value, attrs) { var el = F.h('input', {className: C.input, attrs: attrs || {}}); el.value = value == null ? '' : value; return el; }
  function textarea(value) { var el = F.h('textarea', {className: C.input}); el.value = value || ''; return el; }
  function select(options, value) {
    var el = F.h('select', {className: C.input});
    options.forEach(function (o) { var opt = F.h('option', {text: o[1], attrs: {value: o[0]}}); el.appendChild(opt); });
    el.value = value;
    return el;
  }

  async function load() {
    var results = await Promise.all([
      F.data.list('policies', {limit: 256}),
      F.data.list('settings', {limit: 1}),
      F.action('status', {}).catch(function () { return {}; }),
      F.action('interfaces', {}).catch(function () { return {}; }),
      F.action('check', {}).catch(function () { return {}; }),
      F.action('bans', {limit: 100}).catch(function () { return {}; }),
      F.action('events', {limit: 100}).catch(function () { return {}; })
    ]);
    state.policies = (results[0].records || []).sort(function (a, b) { return a.key < b.key ? -1 : 1; });
    var s = (results[1].records || [])[0];
    state.settings = s ? s.data : {};
    state.status = results[2].result || null;
    state.interfaces = results[3].result || [];
    state.check = results[4].result || null;
    state.bans = results[5].result || null;
    state.events = results[6].result || [];
    render();
  }

  async function refreshStatus() {
    try { state.status = (await F.action('status', {})).result || null; } catch (e) { /* keep the last one */ }
    render();
  }

  function scheduleTick() {
    clearTimeout(timerHandle);
    if (state.status && state.status.pending) timerHandle = setTimeout(refreshStatus, 2000);
  }

  async function apply() {
    var seconds = Number(state.settings.confirm_timeout_seconds || 120);
    var check;
    try {
      check = (await F.action('check', {})).result || {errors: [], warnings: [], token: ''};
    } catch (e) {
      F.toastError(e);
      return;
    }
    state.check = check;
    render();
    if (check.errors.length) {
      F.toastError(t('errorsTitle'));
      return;
    }
    var message = check.warnings.length ? t('applyWithWarnings', {count: check.warnings.length, seconds: seconds}) : t('applyConfirm', {seconds: seconds});
    if (!(await F.confirm({title: t('apply'), message: message, danger: check.warnings.length > 0}))) return;
    F.toast(t('applying'));
    try {
      await F.action('apply', check.token ? {accept_warnings: check.token} : {});
    } catch (e) {
      F.toastError(e);
      await refreshStatus();
      return;
    }
    // A fresh round trip under the new rules proves this page still reaches
    // the API; only then keep them.
    await new Promise(function (resolve) { setTimeout(resolve, 2000); });
    try {
      await F.action('status', {});
      await F.action('confirm', {});
      F.notify(t('confirmed'), 4000, 'success');
    } catch (e) {
      F.toastError(t('confirmFailed'));
    }
    await load();
  }

  async function confirmNow() {
    try { await F.action('confirm', {}); F.notify(t('confirmed'), 4000, 'success'); } catch (e) { F.toastError(e); }
    await load();
  }

  async function rollbackNow() {
    try { await F.action('rollback', {}); F.notify(t('rolledBackNow'), 4000, 'info'); } catch (e) { F.toastError(e); }
    await load();
  }

  function statusCard() {
    var st = state.status;
    var children = [];
    var toolbar = F.h('div', {className: 'fw-row'}, [
      F.button(t('apply'), apply),
      F.button(t('refresh'), load, true)
    ]);
    children.push(F.h('h2', {className: C.title, text: t('title')}));
    children.push(F.h('p', {className: C.description, text: t('desc')}));
    children.push(toolbar);
    var ck = state.check;
    if (ck && (ck.errors.length || ck.warnings.length)) {
      var items = ck.errors.length ? ck.errors : ck.warnings.map(function (w) { return w.message; });
      children.push(F.h('div', {className: C.card + ' fw-banner' + (ck.errors.length ? ' fw-error' : '')}, [
        F.h('strong', {text: ck.errors.length ? t('errorsTitle') : t('warningsTitle')}),
        F.h('ul', {}, items.map(function (text) { return F.h('li', {text: text}); }))
      ]));
    }
    if (st) {
      var badges = F.h('div', {className: 'fw-row'}, [
        F.badge(t('generation') + ' ' + st.generation),
        F.badge(st.draft_changed ? t('draftChanged') : t('draftSame'))
      ]);
      children.push(badges);
      if (st.pending) {
        children.push(F.h('div', {className: C.card + ' fw-banner'}, [
          F.h('strong', {text: t('pendingTitle')}),
          F.h('p', {text: t('pendingBody', {seconds: st.pending.remaining_seconds})}),
          F.h('div', {className: 'fw-row'}, [F.button(t('confirm'), confirmNow), F.button(t('rollback'), rollbackNow, true)])
        ]));
      } else if (st.rolled_back_at && (!st.confirmed_at || st.rolled_back_at > st.confirmed_at)) {
        children.push(F.h('p', {className: C.muted, text: t('rolledBack', {time: new Date(st.rolled_back_at).toLocaleString(), reason: t('reason_' + (st.rollback_reason || 'manual'))})}));
      }
      if (!st.loaded) children.push(F.h('p', {className: C.muted, text: t('notLoaded')}));
      var at = st.attachments;
      if (at && at.error) children.push(F.h('p', {className: 'fw-error', text: t('attachFailed') + ': ' + at.error}));
      if (at && at.interfaces.length) {
        children.push(F.h('div', {className: 'fw-row'}, at.interfaces.map(function (a) {
          var label = a.error ? t('attachError', {error: a.error}) : !a.attached ? t('attachNone') : a.mode === 'generic' ? t('attachGeneric') : a.mode === 'tc' ? t('attachTC') : t('attachDriver');
          return F.badge(a.interface + ': ' + label);
        })));
      }
      if (st.core && st.core.pinned_to_tc) children.push(F.h('p', {className: C.muted, text: t('corePinned')}));
      if (st.last_error) children.push(F.h('p', {className: 'fw-error', text: t('lastError') + ': ' + st.last_error}));
      if (st.evasive_drops) children.push(F.stat(t('evasive'), st.evasive_drops));
    }
    return F.card(children);
  }

  function settingsCard() {
    var current = state.settings || {};
    var chosen = {};
    (current.interfaces || []).forEach(function (n) { chosen[n] = true; });
    var boxes = state.interfaces.map(function (l) {
      var box = F.h('input', {attrs: {type: 'checkbox'}});
      box.checked = !!chosen[l.name];
      box.addEventListener('change', function () { chosen[l.name] = box.checked; });
      var note = [l.kind || 'device'];
      if (l.master) note.push('→ ' + l.master);
      if (l.l3) note.push('L3');
      return F.h('label', {className: 'fw-iface'}, [box, F.h('span', {text: l.name}), F.h('span', {className: C.muted, text: note.join(' ')})]);
    });
    (current.interfaces || []).forEach(function (n) {
      if (!state.interfaces.some(function (l) { return l.name === n; })) {
        var box = F.h('input', {attrs: {type: 'checkbox'}});
        box.checked = true;
        box.addEventListener('change', function () { chosen[n] = box.checked; });
        boxes.push(F.h('label', {className: 'fw-iface'}, [box, F.h('span', {text: n + ' (?)'})]));
      }
    });
    var trusted = textarea((current.trusted_sources || []).join('\n'));
    var timeout = input(current.confirm_timeout_seconds || 120, {type: 'number', min: 30, max: 600});
    var logRate = input(current.log_per_second === undefined ? 10 : current.log_per_second, {type: 'number', min: 0, max: 1000});
    var save = F.button(t('saveSettings'), async function () {
      var data = {
        interfaces: Object.keys(chosen).filter(function (n) { return chosen[n]; }),
        trusted_sources: lines(trusted.value),
        confirm_timeout_seconds: Number(timeout.value) || 120,
        log_per_second: Math.max(0, Math.min(1000, Math.floor(Number(logRate.value) || 0)))
      };
      try { await F.data.upsert('settings', 'default', data); F.toast(t('saved')); await load(); } catch (e) { F.toastError(e); }
    });
    return F.card([
      F.h('h3', {className: C.title, text: t('settings')}),
      F.h('div', {className: C.description, text: t('interfacesHint')}),
      state.status && state.status.core && state.status.core.prefers_xdp && !state.status.core.pinned_to_tc
        ? F.h('div', {className: C.description, text: t('corePrefersXDP')}) : null,
      field(t('interfaces'), F.h('div', {className: 'fw-ifaces'}, boxes)),
      field(t('trusted'), trusted),
      field(t('timeout'), timeout),
      field(t('logRate'), logRate),
      save
    ]);
  }

  function countersFor(key) {
    var st = state.status;
    var item = st && (st.policies || []).find(function (p) { return p.key === key; });
    if (!item || !item.counters) return '–';
    var c = item.counters;
    return [c.pass, c.drop, c.trusted, c.banned || 0, c.rate_limited || 0].join(' / ');
  }

  function limitText(limit) {
    if (!limit) return '–';
    var text = t('limitShort', {max: limit.max_new, window: limit.window_seconds});
    return limit.ban_seconds ? text + ', ' + t('banShort', {ban: limit.ban_seconds}) : text;
  }

  function policyRow(record) {
    var d = record.data || {};
    var match = (d.protocol || 'tcp') + ' ' + (d.ports || []).join(',') + ((d.destinations || []).length ? ' → ' + d.destinations.join(', ') : '');
    var allows = (d.sources || []).filter(function (s) { return s.action === 'allow'; }).length;
    var drops = (d.sources || []).length - allows;
    return [
      d.name || record.key,
      F.h('span', {className: 'fw-mono', text: match}),
      t(d.default_action === 'allow' ? 'allow' : 'drop'),
      allows + ' ' + t('allow') + ', ' + drops + ' ' + t('drop'),
      limitText(d.syn_limit),
      F.h('span', {className: 'fw-counter', text: countersFor(record.key)}),
      record.enabled === false ? t('off') : t('on'),
      F.h('div', {className: 'fw-row'}, [
        F.button(t('edit'), function () { state.editing = record; render(); }, true),
        F.button(t('remove'), async function () {
          if (!(await F.confirm({title: t('remove'), message: t('deleteConfirm', {name: d.name || record.key}), danger: true}))) return;
          try { await F.data.delete('policies', record.key); await load(); } catch (e) { F.toastError(e); }
        }, true)
      ])
    ];
  }

  function editorCard() {
    var record = state.editing;
    var d = record.data || {};
    var name = input(d.name || '');
    var protocol = select([['tcp', 'TCP'], ['udp', 'UDP'], ['tcp+udp', 'TCP + UDP']], d.protocol || 'tcp');
    var ports = input((d.ports || []).join(', '));
    var dsts = textarea((d.destinations || []).join('\n'));
    var def = select([['drop', t('drop')], ['allow', t('allow')]], d.default_action || 'drop');
    var sources = textarea((d.sources || []).map(function (s) { return s.cidr + ' ' + s.action; }).join('\n'));
    var enabled = F.h('input', {attrs: {type: 'checkbox'}});
    enabled.checked = record.enabled !== false;
    var lim = d.syn_limit || {};
    var limitOn = F.h('input', {attrs: {type: 'checkbox'}});
    limitOn.checked = !!d.syn_limit;
    var maxNew = input(lim.max_new || 20, {type: 'number', min: 1, max: 1000000});
    var windowSeconds = input(lim.window_seconds || 10, {type: 'number', min: 1, max: 3600});
    var banSeconds = input(lim.ban_seconds === undefined ? 300 : lim.ban_seconds, {type: 'number', min: 0, max: 604800});
    var ipv6Prefix = input(lim.ipv6_prefix || 64, {type: 'number', min: 32, max: 128});
    var limitFields = F.h('div', {className: 'fw-row'}, [
      F.h('div', {className: 'fw-grow'}, field(t('maxNew'), maxNew)),
      F.h('div', {className: 'fw-grow'}, field(t('windowSeconds'), windowSeconds)),
      F.h('div', {className: 'fw-grow'}, field(t('banSeconds'), banSeconds)),
      F.h('div', {className: 'fw-grow'}, field(t('ipv6Prefix'), ipv6Prefix))
    ]);
    limitFields.hidden = !limitOn.checked;
    limitOn.addEventListener('change', function () { limitFields.hidden = !limitOn.checked; F.requestResize(); });
    var error = F.h('p', {className: 'fw-error'});
    var save = F.button(t('save'), async function () {
      var data = {
        name: name.value.trim(),
        protocol: protocol.value,
        ports: ports.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        destinations: lines(dsts.value),
        default_action: def.value,
        sources: lines(sources.value).map(function (line) {
          var parts = line.split(/\s+/);
          return {cidr: parts[0], action: (parts[1] || 'allow').toLowerCase() === 'drop' ? 'drop' : 'allow'};
        })
      };
      if (limitOn.checked) {
        data.syn_limit = {
          max_new: Math.floor(Number(maxNew.value)),
          window_seconds: Math.floor(Number(windowSeconds.value)),
          ban_seconds: Math.floor(Number(banSeconds.value) || 0),
          ipv6_prefix: Math.floor(Number(ipv6Prefix.value) || 64)
        };
      }
      try {
        if (record.key) await F.data.update('policies', record.key, data, {enabled: enabled.checked});
        else await F.data.create('policies', data, {enabled: enabled.checked});
        state.editing = null;
        F.toast(t('saved'));
        await load();
      } catch (e) {
        error.textContent = F.errorText(e);
        F.requestResize();
      }
    });
    return F.card([
      F.h('h3', {className: C.title, text: record.key ? t('edit') + ' ' + (d.name || record.key) : t('newPolicy')}),
      F.h('div', {className: 'fw-row'}, [F.h('div', {className: 'fw-grow'}, field(t('name'), name)), F.h('div', {className: 'fw-grow'}, field(t('protocol'), protocol))]),
      field(t('ports'), ports),
      field(t('destinations'), dsts),
      field(t('defaultAction'), def),
      field(t('sources'), sources),
      F.h('label', {className: 'fw-iface'}, [limitOn, F.h('span', {text: t('synLimit')})]),
      F.h('div', {className: C.description, text: t('synLimitHint')}),
      limitFields,
      F.h('label', {className: 'fw-iface'}, [enabled, F.h('span', {text: t('enabled')})]),
      error,
      F.h('div', {className: 'fw-row'}, [save, F.button(t('cancel'), function () { state.editing = null; render(); }, true)])
    ]);
  }

  // F.table turns every cell into text; the policy rows hold elements too.
  function cell(tag, value) {
    return F.h(tag, null, [value instanceof Node ? value : (value == null || value === '' ? '-' : String(value))]);
  }
  function nodeTable(headers, rows) {
    return F.h('table', {className: C.table}, [
      F.h('thead', null, F.h('tr', null, headers.map(function (h) { return cell('th', h); }))),
      F.h('tbody', null, rows.map(function (row) { return F.h('tr', null, row.map(function (c) { return cell('td', c); })); }))
    ]);
  }

  function policiesCard() {
    var rows = state.policies.map(policyRow);
    var body = rows.length
      ? nodeTable([t('colName'), t('colMatch'), t('colDefault'), t('colSources'), t('colLimit'), t('colCounters'), t('colEnabled'), ''], rows)
      : F.h('p', {className: C.muted, text: t('none')});
    return F.card([
      F.h('div', {className: 'fw-row'}, [
        F.h('h3', {className: C.title + ' fw-grow', text: t('policies')}),
        F.button(t('newPolicy'), function () { state.editing = {key: '', data: {protocol: 'tcp', default_action: 'drop'}, enabled: true}; render(); })
      ]),
      body
    ]);
  }

  async function unban(payload, question) {
    if (question && !(await F.confirm({title: t('unbanAll'), message: question, danger: true}))) return;
    try { await F.action('unban', payload); } catch (e) { F.toastError(e); }
    await load();
  }

  async function moreBans() {
    try {
      var next = (await F.action('bans', {limit: 100, cursor: state.bans.cursor})).result;
      state.bans = {items: state.bans.items.concat(next.items || []), cursor: next.cursor, done: next.done, clock: next.clock};
    } catch (e) { F.toastError(e); }
    render();
  }

  function bansCard() {
    var bans = state.bans;
    var items = bans && bans.items ? bans.items : [];
    var head = F.h('div', {className: 'fw-row'}, [F.h('h3', {className: C.title + ' fw-grow', text: t('bans')})]);
    if (items.length) head.appendChild(F.button(t('unbanAll'), function () { unban({all: true}, t('unbanAllConfirm')); }, true));
    var body = items.length
      ? nodeTable([t('colSource'), t('colPolicy'), t('colRemaining'), ''], items.map(function (b) {
        return [
          F.h('span', {className: 'fw-mono', text: b.source}),
          b.policy_name || b.policy || '–',
          b.remaining_seconds === null ? t('remainingUnknown') : t('remaining', {seconds: b.remaining_seconds}),
          F.button(t('unban'), function () { unban({key: b.key}); }, true)
        ];
      }))
      : F.h('p', {className: C.muted, text: t('bansNone')});
    var parts = [head, body];
    if (bans && !bans.done && bans.cursor) parts.push(F.button(t('more'), moreBans, true));
    return F.card(parts);
  }

  function endpoint(addr, port) {
    if (!addr) return '–';
    return (addr.indexOf(':') >= 0 ? '[' + addr + ']' : addr) + (port ? ':' + port : '');
  }

  function logCard() {
    var st = state.status;
    var parts = [F.h('h3', {className: C.title, text: t('dropLog')}), F.h('div', {className: C.description, text: t('dropLogHint')})];
    if (st && st.drop_log) parts.push(F.h('p', {className: C.muted, text: t('logStats', {logged: st.drop_log.logged, lost: st.drop_log.lost})}));
    var events = state.events || [];
    parts.push(events.length
      ? nodeTable([t('colTime'), t('colReason'), t('colIface'), t('colFrom'), t('colTo'), t('colPolicy')], events.map(function (e) {
        return [
          e.at_ms ? new Date(e.at_ms).toLocaleTimeString() : '–',
          t('reasonDrop_' + e.reason),
          e.interface,
          F.h('span', {className: 'fw-mono', text: endpoint(e.source, e.source_port)}),
          F.h('span', {className: 'fw-mono', text: (e.protocol ? e.protocol + ' ' : '') + endpoint(e.destination, e.port)}),
          e.policy_name || e.policy || '–'
        ];
      }))
      : F.h('p', {className: C.muted, text: t('logEmpty')}));
    return F.card(parts);
  }

  function render() {
    root.textContent = '';
    var parts = [statusCard()];
    if (state.editing) parts.push(editorCard());
    parts.push(policiesCard(), bansCard(), logCard(), settingsCard());
    root.appendChild(F.stack(parts));
    F.requestResize();
    scheduleTick();
  }

  F.onLocaleChange(render);
  load().catch(function (e) { F.toastError(e); });
})();
</script>
</body>
</html>
