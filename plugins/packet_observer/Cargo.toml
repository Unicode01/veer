[package]
name = "veer-plugin-packet-observer"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Example runtime plugin: a TC pre_forward observer with a small control side"

[lib]
name = "packet_observer"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin" }

[dev-dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin", features = ["testing"] }
