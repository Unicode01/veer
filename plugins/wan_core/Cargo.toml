[package]
name = "veer-plugin-wan-core"
version = "1.8.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Protocol-neutral WAN adapter with direct and kernel-segmented Linux L3 handoff modes"

[lib]
name = "wan_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin" }

[dev-dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin", features = ["testing"] }
