[package]
name = "veer-plugin-pppoe-client"
version = "1.10.2"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PPPoE WAN control and bidirectional TC pipeline integration"

[lib]
name = "pppoe_client"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin" }
serde_json.workspace = true

[dev-dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin", features = ["testing"] }
