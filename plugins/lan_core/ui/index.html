<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Core</title>
  <style>
    .lan-page {
      padding: 8px;
    }
    .lan-hero {
      padding: 11px 12px;
    }
    .lan-hero .veer-toolbar {
      align-items: flex-start;
    }
    .lan-title-row {
      min-width: 0;
    }
    .lan-badges {
      justify-content: flex-end;
    }
    .lan-overview {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .lan-config-card {
      display: grid;
      gap: 12px;
    }
    .lan-config-card > * + * {
      margin-top: 0;
    }
    .lan-section-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .lan-service-section {
      grid-column: 1 / -1;
    }
    .lan-service-section .lan-form-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .lan-form-section {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--veer-border);
      border-radius: 9px;
      background: color-mix(in srgb, var(--veer-surface-soft) 72%, transparent);
    }
    .lan-form-section > * + * {
      margin-top: 10px;
    }
    .lan-section-title {
      margin: 0;
      color: var(--veer-text);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 760;
    }
    .lan-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 10px;
      align-items: end;
    }
    .lan-field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      color: var(--veer-muted);
      font-size: 11px;
      font-weight: 650;
    }
    .lan-field-label > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lan-hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      border: 1px solid var(--veer-border);
      border-radius: 999px;
      color: var(--veer-soft);
      background: var(--veer-surface);
      font-size: 10px;
      font-weight: 800;
      cursor: help;
    }
    .lan-check-field {
      min-height: 31px;
      padding: 5px 8px;
      border: 1px solid var(--veer-border);
      border-radius: 8px;
      background: var(--veer-surface);
    }
    .lan-check-field label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lan-check-field .veer-input[type="checkbox"] {
      flex: 0 0 auto;
    }
    .lan-protocols {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 31px;
      padding: 5px 8px;
      border: 1px solid var(--veer-border);
      border-radius: 8px;
      background: var(--veer-surface);
    }
    .lan-protocols label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--veer-muted);
      font-size: 11px;
      font-weight: 650;
    }
    .lan-protocols .veer-input[type="checkbox"] {
      width: 30px;
      min-width: 30px;
      height: 18px;
      min-height: 18px;
    }
    .lan-protocols .veer-input[type="checkbox"]::before {
      width: 12px;
      height: 12px;
    }
    .lan-protocols .veer-input[type="checkbox"]:checked::before {
      transform: translateX(12px);
    }
    .lan-effective-list { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .lan-effective-row {
      display: grid;
      grid-template-columns: minmax(88px, 120px) minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }
    .lan-effective-label {
      padding-top: 3px;
      color: var(--veer-muted);
      font-size: 11px;
      font-weight: 650;
    }
    .lan-runtime-note {
      margin: 0;
      color: var(--veer-muted);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .lan-actions {
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }
    .lan-output-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .lan-output-card {
      min-height: 68px;
    }
    .lan-traffic-table {
      min-width: 0;
      overflow-x: auto;
    }
    @media (max-width: 880px) {
      .lan-section-grid,
      .lan-output-grid,
      .lan-overview {
        grid-template-columns: 1fr;
      }
      .lan-service-section .lan-form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 620px) {
      .lan-form-grid {
        grid-template-columns: 1fr;
      }
      .lan-service-section .lan-form-grid {
        grid-template-columns: 1fr;
      }
      .lan-actions .veer-button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

        node.textContent = T(key, params);
        textBindings.push({ node, key, params });
        return node;
      }

      function bindPrefixedText(node, prefix, key, params) {
        node.textContent = String(prefix || '') + T(key, params);
        textBindings.push({ node, prefix: String(prefix || ''), key, params });
        return node;
      }

      function bindAttr(node, attr, key, params) {
        node.setAttribute(attr, T(key, params));
        attrBindings.push({ node, attr, key, params });
        return node;
      }

      function textNode(tag, opts, key, params) {
        return bindText(F.h(tag, opts || {}), key, params);
      }

        return bindText(F.button(T(key), handler, secondary), key);
      }

        statusKey = key;
        status.textContent = T(key);
      }

        textBindings.forEach((item) => {
          item.node.textContent = (item.prefix || '') + T(item.key, item.params);
        });
        attrBindings.forEach((item) => {
          item.node.setAttribute(item.attr, T(item.key, item.params));
        });

        wanPicker.refreshLabels();
        renderStatus();
        renderPlan();
        renderTraffic();
        F.requestResize();

      const bridge = input('br-lan', 'br-lan');
      const ports = input('', 'eth1, eth2, eth3');
      const addresses = input('192.168.100.1/24', '192.168.100.1/24, fd00:100::1/64');
      const mtu = input('1500', 'mtu', 'number');
      const wanEgress = input('', 'eth0 / pppoe-wan / veervtap0');
      const wanSource = input('', 'optional WAN source IP');
      const redirectMode = input('', 'blank / prepared_l2');
      const natType = select([['symmetric', 'value.symmetric'], ['full_cone', 'value.fullCone']]);
      const autoNAT = checkbox(true);
      const autoIPv6PD = checkbox(true);
      const dhcpv4Enabled = checkbox(true);
      const dnsMode = select([['auto', 'value.dnsAuto'], ['manual', 'value.dnsManual'], ['disabled', 'value.dnsDisabled']]);
      const dnsServers = input('', '223.5.5.5, 2400:3200::1');
      const dhcpv4PoolStart = input('', '192.168.100.100');
      const dhcpv4PoolEnd = input('', '192.168.100.200');
      let dnsServersField = null;
      let dhcpv4PoolStartField = null;
      let dhcpv4PoolEndField = null;
      const ipv6SubnetID = input('0', '0', 'number');
      ipv6SubnetID.min = '0';
      ipv6SubnetID.max = '65535';
      ipv6SubnetID.step = '1';
      const preserveBridge = checkbox(false);
      const protocolTCP = checkbox(true);
      const protocolUDP = checkbox(true);
      const protocolICMP = checkbox(false);
      const protocolControl = F.h('div', { className: 'lan-protocols' }, [
        F.h('label', null, [protocolTCP, F.h('span', { text: 'TCP' })]),
        F.h('label', null, [protocolUDP, F.h('span', { text: 'UDP' })]),
        F.h('label', null, [protocolICMP, F.h('span', { text: 'ICMP' })])
      ]);
      F.onLocaleChange(refreshI18n);

      function input(value, placeholder, type) {
        return F.h('input', {
          className: F.classes.input,
          attrs: { type: type || 'text', value, placeholder }
        });
      }

      function checkbox(checked) {
        return F.h('input', {
          className: F.classes.input,
          attrs: { type: 'checkbox', checked: !!checked }
        });
      }

      function select(options) {
        return F.h('select', { className: F.classes.input }, options.map((item) => {
          const option = F.h('option', { text: T(item[1]), attrs: { value: item[0] } });
          textBindings.push({ node: option, key: item[1] });
          return option;
        }));
      }

      function field(labelKey, control, hintKey) {
        const labelChildren = [textNode('span', null, labelKey)];
        if (hintKey) {
          labelChildren.push(bindAttr(F.h('span', { className: 'lan-hint', text: '?' }), 'title', hintKey));
        }
        return F.h('label', { className: F.classes.field + ' lan-field' }, [
          F.h('span', { className: 'lan-field-label' }, labelChildren),
          control
        ]);
      }

      function checkboxField(labelKey, control, hintKey) {
        const label = F.h('label', null, [
          control,
          bindPrefixedText(F.h('span'), '', labelKey)
        ]);
        if (hintKey) bindAttr(label, 'title', hintKey);
        return F.h('div', { className: F.classes.field + ' lan-check-field' }, [
          label
        ]);
      }

      function section(titleKey, children, extraClass) {
        return F.h('section', { className: 'lan-form-section' + (extraClass ? ' ' + extraClass : '') }, [
          textNode('h2', { className: 'lan-section-title' }, titleKey),
          F.h('div', { className: 'lan-form-grid' }, children)
        ]);
      }

      function actions(children) {
        return F.h('div', { className: F.classes.toolbar + ' lan-actions' }, children);
      }

      function setBusy(button, busy, text) {
        pendingButton = busy ? button : null;
        pendingLabel = busy && text ? text : '';
        syncActionButtons();
      }

      function syncActionButtons() {
        if (!applyButton) return;
        const phase = String(lastStatusData && lastStatusData.phase || '').toLowerCase();
        const applied = phase === 'applied';
        const removable = !!lastStatusData && !['disabled', 'deleted'].includes(phase);
        [saveButton, loadButton, refreshButton].forEach(function (button) {
          F.setButtonState(button, {
            label: button === pendingButton ? pendingLabel : T(button === saveButton ? 'action.save' : (button === loadButton ? 'action.load' : 'action.refresh')),
            busy: button === pendingButton,
            disabled: !!pendingButton && button !== pendingButton
          });
        });
        F.setButtonState(applyButton, {
          label: applyButton === pendingButton ? pendingLabel : T(applied ? 'action.update' : 'action.apply'),
          busy: applyButton === pendingButton,
          disabled: !!pendingButton && applyButton !== pendingButton
        });
        F.setButtonState(teardownButton, {
          label: teardownButton === pendingButton ? pendingLabel : T('action.teardown'),
          busy: teardownButton === pendingButton,
          disabled: !removable || (!!pendingButton && teardownButton !== pendingButton),
          tone: 'danger',
          title: removable ? '' : T('hint.noRuntime')
        });
      }

      async function runButtonTask(button, busyText, task) {
        if (pendingButton) return;
        setBusy(button, true, busyText);
        try {
          await task();
        } finally {
          setBusy(button, false);
          F.requestResize();
        }
      }

      function key() {
        const value = lanPicker.value();
        if (!value) throw new Error(T('error.keyRequired'));
        return value;
      }

      function wanKey() {
        return wanPicker.value() || 'default';
      }

      function csv(value) {
        return value.split(',').map((item) => item.trim()).filter(Boolean);
      }

      function payload() {
        const protocols = [];
        if (protocolTCP.checked) protocols.push('tcp');
        if (protocolUDP.checked) protocols.push('udp');
        if (protocolICMP.checked) protocols.push('icmp');
        if (!protocols.length) throw new Error(T('error.protocolRequired'));
        return {
          key: key(),
          lan_id: key(),
          bridge: bridge.value.trim() || 'br-lan',
          ports: csv(ports.value),
          addresses: csv(addresses.value),
          mtu: Number(mtu.value || 1500),
          wan_ref: wanKey(),
          wan_egress_interface: wanEgress.value.trim(),
          wan_egress_source_ip: wanSource.value.trim(),
          redirect_mode: redirectMode.value.trim(),
          nat_type: natType.value || 'symmetric',
          protocol: protocols.join('+'),
          auto_egress_nat: autoNAT.checked,
          auto_ipv6_pd: autoIPv6PD.checked,
          dhcpv4_enabled: dhcpv4Enabled.checked,
          dhcpv4_pool_start: dhcpv4PoolStart.value.trim(),
          dhcpv4_pool_end: dhcpv4PoolEnd.value.trim(),
          dns_mode: dnsMode.value || 'auto',
          dns_servers: csv(dnsServers.value),
          ipv6_subnet_id: Number(ipv6SubnetID.value || 0),
          preserve_bridge: preserveBridge.checked
        };
      }

      function resetForm() {
        bridge.value = 'br-lan';
        ports.value = '';
        addresses.value = '192.168.100.1/24';
        mtu.value = '1500';
        const wanKeys = wanRecords.map(function (item) { return item.key; });
        wanPicker.setKeys(wanKeys, wanKeys[0] || 'default', wanKeys.length === 0);
        updateWANPickerVisibility();
        wanEgress.value = '';
        wanSource.value = '';
        redirectMode.value = '';
        natType.value = 'symmetric';
        autoNAT.checked = true;
        autoIPv6PD.checked = true;
        dhcpv4Enabled.checked = true;
        dnsMode.value = 'auto';
        dnsServers.value = '';
        dhcpv4PoolStart.value = '';
        dhcpv4PoolEnd.value = '';
        ipv6SubnetID.value = '0';
        preserveBridge.checked = false;
        protocolTCP.checked = true;
        protocolUDP.checked = true;
        protocolICMP.checked = false;
        lastStatusData = null;
        lastPlanData = null;
        lastIPv6PlanData = null;
        lastDHCPv4PlanData = null;
        syncAddressServiceFields();
      }

      function recordData(resource, recordKey) {
        const list = records[resource] || [];
        const record = list.find(function (item) { return item && item.key === recordKey; });
        return record && record.data ? Object.assign({ updated_at: record.updated_at || '' }, record.data) : null;
      }

      function fillForm(recordKey) {
        const data = recordData('profiles', recordKey) || {};
        bridge.value = data.bridge || data.bridge_interface || 'br-lan';
        ports.value = Array.isArray(data.ports) ? data.ports.join(', ') : (data.ports || '');
        addresses.value = Array.isArray(data.addresses) ? data.addresses.join(', ') : (data.addresses || data.ipv4_cidr || '192.168.100.1/24');
        mtu.value = data.mtu || data.bridge_mtu || 1500;
        const ref = data.wan_ref || data.wan || 'default';
        const wanKeys = wanRecords.map(function (item) { return item.key; });
        let selectedRef = ref;
        if (!wanKeys.includes(ref)) {
          if (ref !== 'default') wanKeys.push(ref);
          else selectedRef = wanKeys.includes(wanPicker.value()) ? wanPicker.value() : (wanKeys[0] || ref);
        }
        wanPicker.setKeys(wanKeys, selectedRef, wanKeys.length === 0);
        updateWANPickerVisibility();
        wanEgress.value = data.wan_egress_interface || data.out_interface || '';
        wanSource.value = data.wan_egress_source_ip || data.out_source_ip || '';
        redirectMode.value = data.redirect_mode || data.egress_nat_redirect_mode || '';
        natType.value = data.nat_type === 'full_cone' ? 'full_cone' : 'symmetric';
        autoNAT.checked = data.auto_egress_nat !== false;
        autoIPv6PD.checked = data.auto_ipv6_pd !== false;
        dhcpv4Enabled.checked = data.dhcpv4_enabled === true;
        dnsMode.value = ['auto', 'manual', 'disabled'].includes(data.dns_mode) ? data.dns_mode : 'auto';
        dnsServers.value = Array.isArray(data.dns_servers) ? data.dns_servers.join(', ') : (data.dns_servers || '');
        dhcpv4PoolStart.value = data.dhcpv4_pool_start || '';
        dhcpv4PoolEnd.value = data.dhcpv4_pool_end || '';
        ipv6SubnetID.value = data.ipv6_subnet_id == null ? '0' : String(data.ipv6_subnet_id);
        preserveBridge.checked = data.preserve_bridge === true || String(bridge.value).toLowerCase().indexOf('vmbr') === 0;
        const selected = new Set(String(data.protocol || 'tcp+udp').toLowerCase().split('+'));
        protocolTCP.checked = selected.has('tcp');
        protocolUDP.checked = selected.has('udp');
        protocolICMP.checked = selected.has('icmp');
        lastStatusData = recordData('status', recordKey);
        lastPlanData = recordData('plans', recordKey);
        lastIPv6PlanData = recordData('ipv6Plans', recordKey);
        lastDHCPv4PlanData = recordData('dhcpv4Plans', recordKey);
        syncAddressServiceFields();
      }

      async function listResource(resource) {
        const response = await F.data.list(resource, { limit: 64 });
        return response && Array.isArray(response.records) ? response.records : [];
      }

      async function refreshWANs(preferred) {
        try {
          const result = await F.plugins.resources.list('wan_core', 'status', { limit: 128 });
          wanRecords = result && Array.isArray(result.records) ? result.records : [];
        } catch (e) {
          wanRecords = [];
        }
        const keys = wanRecords.map(function (item) { return item.key; });
        const active = wanRecords.find(function (record) {
          const data = record && record.data || {};
          const phase = String(data.phase || data.state || '').toLowerCase();
          return record && record.enabled !== false && data.usable !== false && ['applied', 'up', 'ready', 'active'].includes(phase);
        });
        let selected = preferred && keys.includes(preferred) ? preferred : (active ? active.key : (keys[0] || ''));
        if (!selected && preferred) selected = preferred;
        if (preferred && preferred !== 'default' && !keys.includes(preferred)) keys.push(preferred);
        wanPicker.setKeys(keys, selected || 'default', keys.length === 0);
        updateWANPickerVisibility();
      }

      function preferredProfile(preferred) {
        if (preferred) return preferred;
        const active = records.status.find(function (record) {
          const phase = String(record && record.data && record.data.phase || '');
          return phase === 'applied' || phase === 'error';
        });
        if (active) return active.key;
        const enabled = records.profiles.find(function (record) { return record && record.enabled !== false; });
        return enabled ? enabled.key : '';
      }

      function updateProfilePickerVisibility() {
        if (!lanProfileField) return;
        lanProfileField.hidden = lanPicker.keys().length <= 1;
      }

      function updateWANPickerVisibility() {
        if (!wanReferenceField) return;
        wanReferenceField.hidden = wanPicker.keys().length <= 1;
      }

      async function refreshRecords(preferred) {
        const values = await Promise.all([
          listResource('profiles'),
          listResource('status'),
          listResource('egress_nat_plans'),
          listResource('ipv6_assignment_plans'),
          listResource('dhcpv4_plans')
        ]);
        records = { profiles: values[0], status: values[1], plans: values[2], ipv6Plans: values[3], dhcpv4Plans: values[4] };
        const keys = [];
        values.forEach(function (items) {
          items.forEach(function (record) { if (record && record.key && !keys.includes(record.key)) keys.push(record.key); });
        });
        const selected = preferredProfile(preferred);
        lanPicker.setKeys(keys, selected || 'default', keys.length === 0);
        updateProfilePickerVisibility();
        return lanPicker.value();
      }

      async function saveProfile(options) {
        options = options || {};
        setStatus('status.saving');
        try {
          const p = payload();
          await F.data.upsert('profiles', p.lan_id, p, { enabled: true });
          await refreshRecords(p.lan_id);
          fillForm(p.lan_id);
          setStatus('status.saved');
          if (!options.silent) F.toast(T('toast.saved'));
          return p;
        } catch (e) {
          setStatus('status.saveFailed');
          if (!options.silent) F.toastError(e);
          throw e;
        } finally {
          F.requestResize();
        }
      }

      async function loadProfile(options) {
        options = options || {};
        try {
          const selected = await refreshRecords(options.key || (lanPicker.isNew() ? '' : lanPicker.value()));
          const current = recordData('profiles', selected);
          const currentWAN = current && (current.wan_ref || current.wan) || 'default';
          await refreshWANs(currentWAN);
          if (lanPicker.isNew()) resetForm(); else fillForm(selected);
          renderStatus();
          renderPlan();
          await loadTraffic({ key: selected, silent: true });
          if (!options.silent) F.toast(T('toast.loaded'));
        } catch (e) {
          if (!options.silent) F.toastError(e);
          throw e;
        } finally {
          F.requestResize();
        }
      }

      async function apply(button) {
        setBusy(button, true, T('status.applying'));
        setStatus('status.applying');
        try {
          const p = payload();
          await F.action('apply_network', p);
          await loadProfile({ key: p.lan_id, silent: true });
          setStatus('status.applied');
          F.toast(T('toast.applied'));
        } catch (e) {
          setStatus('status.applyFailed');
          F.toastError(e);
        } finally {
          setBusy(button, false, T('action.apply'));
          F.requestResize();
        }
      }

      async function teardown(button) {
        try {
          const confirmed = await F.confirm({
            title: T('confirm.teardownTitle'),
            message: T('confirm.teardownMessage'),
            confirmText: T('action.teardown'),
            cancelText: T('action.cancel'),
            danger: true
          });
          if (!confirmed) return;
        } catch (e) {
          F.toastError(e);
          return;
        }
        setBusy(button, true, T('status.disabling'));
        setStatus('status.disabling');
        try {
          const p = payload();
          await F.action('teardown', p);
          await loadProfile({ key: p.lan_id, silent: true });
          setStatus('status.disabled');
          F.toast(T('toast.disabled'));
        } catch (e) {
          setStatus('status.disableFailed');
          F.toastError(e);
        } finally {
          setBusy(button, false, T('action.teardown'));
          F.requestResize();
        }
      }

      function i18nStat(labelKey, value, detailKey, valueIsKey) {
        const node = F.h('div', { className: F.classes.stat }, [
          textNode('span', { className: F.classes.statLabel }, labelKey),
          valueIsKey
            ? textNode('span', { className: F.classes.statValue }, value)
            : F.h('span', { className: F.classes.statValue, text: value == null || value === '' ? '-' : String(value) })
        ]);
        if (detailKey) bindAttr(node, 'title', detailKey);
        return node;
      }

      function renderStatus() {
        stateBody.replaceChildren();
        if (!lastStatusData) {
          stateBody.appendChild(F.h('p', {
            className: F.classes.description,
            text: T('empty.status')
          }));
          syncActionButtons();
          return;
        }
        const data = lastStatusData;
        const bridgeMembers = Array.isArray(data.bridge_members) ? data.bridge_members : (Array.isArray(data.ports) ? data.ports : []);
        const configuredPorts = Array.isArray(data.configured_ports) ? data.configured_ports : (Array.isArray(data.ports) ? data.ports : []);
        const memberGRO = data.member_gro || null;
        stateBody.appendChild(F.h('div', { className: F.classes.grid }, [
          F.stat(T('stat.phase'), data.phase || '-'),
          F.stat(T('stat.statusBridge'), data.bridge || '-'),
          F.stat(T('stat.statusPorts'), bridgeMembers.length),
          F.stat(T('stat.configuredPorts'), configuredPorts.length),
          F.stat(T('stat.addresses'), Array.isArray(data.bridge_addresses) ? data.bridge_addresses.length : 0),
          F.stat(T('stat.managedPorts'), Array.isArray(data.managed_ports) ? data.managed_ports.length : 0),
          F.stat(T('stat.groCompat'), memberGRO ? (memberGRO.required ? T('value.groMembers', { count: Array.isArray(memberGRO.members) ? memberGRO.members.length : 0 }) : T('value.notRequired')) : '-'),
          F.stat(T('stat.wanRef'), data.wan_ref || '-'),
          F.stat(T('stat.dnsMode'), dnsModeLabel(data.dns && data.dns.mode)),
          F.stat(T('stat.dnsServers'), data.dns && Array.isArray(data.dns.servers) ? data.dns.servers.length : 0),
          F.stat(T('stat.statusMtu'), data.bridge_mtu || data.mtu || '-'),
          F.stat(T('stat.updated'), data.updated_at || '-')
        ]));
        const addressesList = Array.isArray(data.bridge_addresses) ? data.bridge_addresses : [];
        appendEffectiveRow(stateBody, 'status.members', bridgeMembers, memberBadge);
        appendEffectiveRow(stateBody, 'status.addresses', addressesList);
        const effectiveDNS = data.dns && Array.isArray(data.dns.servers) ? data.dns.servers : [];
        appendEffectiveRow(stateBody, 'status.dns', effectiveDNS);
        if (data.bridge_members_error) stateBody.appendChild(F.h('p', { className: 'lan-runtime-note', text: data.bridge_members_error }));
        if (memberGRO && Array.isArray(memberGRO.errors) && memberGRO.errors.length) {
          stateBody.appendChild(F.h('p', { className: 'lan-runtime-note', text: memberGRO.errors.join('; ') }));
        }
        if (data.last_error) stateBody.appendChild(F.h('p', { className: 'lan-runtime-note', text: data.last_error }));
        syncActionButtons();
      }

      function appendEffectiveRow(parent, labelKey, values, renderValue) {
        values = Array.isArray(values) ? values : [];
        if (!values.length) return;
        const badges = values.map(function (value) {
          return renderValue ? renderValue(value) : F.badge(String(value || ''));
        }).filter(Boolean);
        if (!badges.length) return;
        parent.appendChild(F.h('div', { className: 'lan-effective-row' }, [
          textNode('span', { className: 'lan-effective-label' }, labelKey),
          F.h('div', { className: 'lan-effective-list' }, badges)
        ]));
      }

      function memberBadge(value) {
        const member = value && typeof value === 'object' ? value : { name: String(value || '') };
        const name = String(member.name || member.interface || '');
        if (!name) return null;
        const details = [];
        if (member.kind) details.push(String(member.kind));
        if (member.oper_state) details.push(String(member.oper_state));
        if (member.configured === true) details.push(T('stat.configuredPorts'));
        if (member.managed === true) details.push(T('stat.managedPorts'));
        if (member.gro === false) details.push('GRO off');
        const badge = F.badge(name);
        if (details.length) badge.title = details.join(' / ');
        return badge;
      }

      function renderPlan() {
        planBody.replaceChildren();
        if (!lastPlanData && !lastIPv6PlanData && !lastDHCPv4PlanData) {
          planBody.appendChild(F.h('p', {
            className: F.classes.description,
            text: T('empty.plan')
          }));
          return;
        }
        if (lastDHCPv4PlanData) {
          const data = lastDHCPv4PlanData;
          const pool = [data.pool_start, data.pool_end].filter(Boolean).join(' - ') || T('value.auto');
          const dns = Array.isArray(data.dns_servers) && data.dns_servers.length ? data.dns_servers.join(', ') : '-';
          planBody.appendChild(F.h('div', { className: F.classes.grid }, [
            F.stat(T('stat.dhcpv4'), data.enabled ? T('value.yes') : T('value.no')),
            F.stat(T('stat.dnsMode'), dnsModeLabel(data.dns_mode)),
            F.stat(T('stat.dnsServers'), dns),
            F.stat(T('stat.pool'), pool)
          ]));
          if (data.note || data.last_error) {
            planBody.appendChild(F.h('p', { className: 'lan-runtime-note', text: data.last_error || data.note }));
          }
        }
        if (lastPlanData) {
          const data = lastPlanData;
          planBody.appendChild(F.h('div', { className: F.classes.grid }, [
            F.stat(T('stat.enabled'), data.enabled ? T('value.yes') : T('value.no')),
            F.stat(T('stat.parent'), data.parent_interface || '-'),
            F.stat(T('stat.out'), data.out_interface || '-'),
            F.stat(T('stat.source'), data.out_source_ip || '-'),
            F.stat(T('stat.protocol'), data.protocol || '-'),
            F.stat(T('stat.natType'), data.nat_type || '-'),
            F.stat(T('stat.redirect'), data.redirect_mode || '-')
          ]));
          if (data.note || data.last_error) {
            planBody.appendChild(F.h('p', { className: 'lan-runtime-note', text: data.last_error || data.note }));
          }
        }
        if (lastIPv6PlanData) {
          const data = lastIPv6PlanData;
          planBody.appendChild(F.h('div', { className: F.classes.grid }, [
            F.stat(T('stat.pdParent'), data.parent_prefix || '-'),
            F.stat(T('stat.pdAssigned'), data.assigned_prefix || '-'),
            F.stat(T('stat.pdGateway'), data.target_interface || '-'),
            F.stat(T('stat.enabled'), data.enabled ? T('value.yes') : T('value.no'))
          ]));
          if (data.note || data.last_error) {
            planBody.appendChild(F.h('p', { className: 'lan-runtime-note', text: data.last_error || data.note }));
          }
        }
      }

      function updateTraffic(data) {
        if (!data || data.available !== true || !data.bridge) {
          trafficView = { available: false, reason: data && data.reason || '' };
          renderTraffic();
          return;
        }
        const sampledAt = Math.max(0, Number(data.sampled_at_ms || Date.now()));
        const profileKey = String(data.profile_key || 'default');
        trafficView = {
          available: true,
          bridge: trafficLinkView(data.bridge, sampledAt, profileKey),
          ports: (Array.isArray(data.ports) ? data.ports : []).map(function (link) {
            return trafficLinkView(link, sampledAt, profileKey);
          })
        };
        renderTraffic();
      }

      function dnsModeLabel(value) {
        if (value === 'manual') return T('value.dnsManual');
        if (value === 'disabled') return T('value.dnsDisabled');
        if (value === 'auto') return T('value.dnsAuto');
        return '-';
      }

      function trafficLinkView(link, sampledAt, profileKey) {
        link = link || {};
        const stats = link.statistics || null;
        const view = {
          name: String(link.name || '-'),
          up: link.up === true,
          oper_state: String(link.oper_state || ''),
          error: String(link.error || ''),
          statistics: stats
        };
        if (!stats) return view;
        const sample = {
          sampled_at_ms: sampledAt,
          rx_packets: Math.max(0, Number(stats.rx_packets || 0)),
          tx_packets: Math.max(0, Number(stats.tx_packets || 0)),
          rx_bytes: Math.max(0, Number(stats.rx_bytes || 0)),
          tx_bytes: Math.max(0, Number(stats.tx_bytes || 0)),
          rx_errors: Math.max(0, Number(stats.rx_errors || 0)),
          tx_errors: Math.max(0, Number(stats.tx_errors || 0)),
          rx_dropped: Math.max(0, Number(stats.rx_dropped || 0)),
          tx_dropped: Math.max(0, Number(stats.tx_dropped || 0))
        };
        const key = profileKey + '/' + view.name;
        const previous = trafficSamples[key];
        sample.rx_rate = null;
        sample.tx_rate = null;
        if (previous && sample.sampled_at_ms > previous.sampled_at_ms &&
            sample.rx_bytes >= previous.rx_bytes && sample.tx_bytes >= previous.tx_bytes) {
          const seconds = (sample.sampled_at_ms - previous.sampled_at_ms) / 1000;
          sample.rx_rate = (sample.rx_bytes - previous.rx_bytes) / seconds;
          sample.tx_rate = (sample.tx_bytes - previous.tx_bytes) / seconds;
        }
        trafficSamples[key] = sample;
        Object.assign(view, sample);
        return view;
      }

      function renderTraffic() {
        trafficBody.replaceChildren();
        if (!trafficView || trafficView.available !== true || !trafficView.bridge || !trafficView.bridge.statistics) {
          trafficBody.appendChild(F.h('p', {
            className: F.classes.description,
            text: T('traffic.unavailable'),
            title: trafficView && trafficView.reason || ''
          }));
          return;
        }
        const bridgeStats = trafficView.bridge;
        trafficBody.appendChild(F.h('div', { className: F.classes.grid }, [
          F.stat(T('stat.rxRate'), bridgeStats.rx_rate == null ? '-' : formatRate(bridgeStats.rx_rate)),
          F.stat(T('stat.txRate'), bridgeStats.tx_rate == null ? '-' : formatRate(bridgeStats.tx_rate)),
          F.stat(T('stat.rxTotal'), formatBytes(bridgeStats.rx_bytes), T('traffic.packets', { count: formatCount(bridgeStats.rx_packets) })),
          F.stat(T('stat.txTotal'), formatBytes(bridgeStats.tx_bytes), T('traffic.packets', { count: formatCount(bridgeStats.tx_packets) }))
        ]));
        const portsWithStats = (trafficView.ports || []).filter(function (link) { return link && link.statistics; });
        if (portsWithStats.length) {
          trafficBody.appendChild(F.h('h3', { className: 'lan-section-title', text: T('traffic.portStats') }));
          trafficBody.appendChild(F.h('div', { className: 'lan-traffic-table' }, [F.table(
            [T('traffic.interface'), T('stat.rxRate'), T('stat.txRate'), T('stat.rxTotal'), T('stat.txTotal')],
            portsWithStats.map(function (link) {
              return [
                link.name,
                link.rx_rate == null ? '-' : formatRate(link.rx_rate),
                link.tx_rate == null ? '-' : formatRate(link.tx_rate),
                formatBytes(link.rx_bytes),
                formatBytes(link.tx_bytes)
              ];
            })
          )]));
        }
      }

      function formatBytes(value) {
        value = Math.max(0, Number(value || 0));
        const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
        let index = 0;
        while (value >= 1024 && index < units.length - 1) {
          value /= 1024;
          index++;
        }
        const digits = index === 0 || value >= 100 ? 0 : (value >= 10 ? 1 : 2);
        return value.toFixed(digits) + ' ' + units[index];
      }

      function formatRate(value) {
        return formatBytes(value) + '/s';
      }

      function formatCount(value) {
        return Math.max(0, Number(value || 0)).toLocaleString(F.locale === 'en-US' ? 'en-US' : 'zh-CN');
      }

      function loadTraffic(options) {
        options = options || {};
        const profileKey = options.key || (lanPicker.isNew() ? '' : lanPicker.value());
        const serial = ++trafficRequestSerial;
        return F.action('traffic_stats', { profile_key: profileKey || 'default' }).then(function (response) {
          if (serial === trafficRequestSerial) updateTraffic(response && response.result ? response.result : null);
        }).catch(function (error) {
          if (serial === trafficRequestSerial) updateTraffic({ available: false, reason: F.errorText(error) });
          if (!options.silent) F.toastError(error);
        }).finally(function () {
          F.requestResize();
        });
      }

      async function loadStatus() {
        try {
          const values = await Promise.all([listResource('status'), listResource('egress_nat_plans'), listResource('ipv6_assignment_plans'), listResource('dhcpv4_plans')]);
          records.status = values[0];
          records.plans = values[1];
          records.ipv6Plans = values[2];
          records.dhcpv4Plans = values[3];
          const current = key();
          lastStatusData = recordData('status', current);
          lastPlanData = recordData('plans', current);
          lastIPv6PlanData = recordData('ipv6Plans', current);
          lastDHCPv4PlanData = recordData('dhcpv4Plans', current);
          renderStatus();
          renderPlan();
          await loadTraffic({ key: current, silent: true });
        } catch (e) {
          F.toastError(e);
          throw e;
        } finally {
          F.requestResize();
        }
      }

      lanPicker.onChange(function (selection) {
        if (selection.isNew) resetForm(); else fillForm(selection.key);
        renderStatus();
        renderPlan();
        if (selection.isNew) updateTraffic({ available: false });
        else loadTraffic({ key: selection.key, silent: true });
        setStatus('status.idle');
        F.requestResize();
      });

      function syncAddressServiceFields() {
        const manual = dnsMode.value === 'manual';
        if (dnsServersField) dnsServersField.hidden = !manual;
        const dhcpEnabled = dhcpv4Enabled.checked;
        if (dhcpv4PoolStartField) dhcpv4PoolStartField.hidden = !dhcpEnabled;
        if (dhcpv4PoolEndField) dhcpv4PoolEndField.hidden = !dhcpEnabled;
        F.requestResize();
      }

      dnsMode.addEventListener('change', syncAddressServiceFields);
      dhcpv4Enabled.addEventListener('change', syncAddressServiceFields);

      saveButton = i18nButton('action.save', function () {
        runButtonTask(saveButton, T('status.saving'), function () { return saveProfile(); }).catch(function () {});
      });
      loadButton = i18nButton('action.load', function () {
        runButtonTask(loadButton, T('action.load'), function () { return loadProfile({ silent: false }); }).catch(function () {});
      }, true);
      applyButton = i18nButton('action.apply', function () { apply(applyButton); });
      teardownButton = i18nButton('action.teardown', function () { teardown(teardownButton); }, true);
      refreshButton = i18nButton('action.refresh', function () {
        runButtonTask(refreshButton, T('action.refresh'), function () { return loadStatus(); }).catch(function () {});
      }, true);
      syncActionButtons();
      lanProfileField = field('field.lanID', lanPicker.element);
      lanProfileField.hidden = true;
      wanReferenceField = field('field.wanRef', wanPicker.element, 'hint.wanRef');
      wanReferenceField.hidden = true;
      dnsServersField = field('field.dnsServers', dnsServers, 'hint.dnsServers');
      dhcpv4PoolStartField = field('field.poolStart', dhcpv4PoolStart, 'hint.pool');
      dhcpv4PoolEndField = field('field.poolEnd', dhcpv4PoolEnd, 'hint.pool');
      const page = F.h('main', { className: F.classes.page + ' lan-page' }, [
        F.stack([
          F.card([
            F.h('div', { className: F.classes.toolbar }, [
              F.h('div', { className: 'lan-title-row' }, [
                textNode('h1', { className: F.classes.title }, 'title'),
                textNode('p', { className: F.classes.description }, 'desc')
              ]),
              F.h('div', { className: F.classes.toolbar + ' lan-badges' }, [
                bindText(F.badge(T('badge.netAdmin')), 'badge.netAdmin'),
                bindText(F.badge(T('badge.bridge')), 'badge.bridge'),
                status
              ])
            ])
          ], { className: 'lan-hero' }),
          F.h('div', { className: F.classes.grid + ' lan-overview' }, [
            i18nStat('stat.bridge', 'br-lan', 'stat.bridge.detail'),
            i18nStat('stat.ports', 'stat.ports.value', 'stat.ports.detail', true),
            i18nStat('stat.coreNat', 'stat.coreNat.value', 'stat.coreNat.detail', true)
          ]),
          F.card([
            F.h('div', { className: 'lan-section-grid' }, [
              section('profile.title', [
                lanProfileField,
                field('field.bridge', bridge, 'hint.bridge'),
                field('field.ports', ports, 'hint.ports'),
                field('field.addresses', addresses, 'hint.addresses'),
                field('field.mtu', mtu),
                field('field.natType', natType, 'hint.natType'),
                field('field.protocol', protocolControl, 'hint.protocol'),
                checkboxField('field.autoNat', autoNAT, 'hint.autoNat'),
                checkboxField('field.autoIPv6PD', autoIPv6PD, 'hint.autoIPv6PD'),
                field('field.ipv6SubnetID', ipv6SubnetID, 'hint.ipv6SubnetID'),
                checkboxField('field.preserveBridge', preserveBridge, 'hint.preserveBridge')
              ]),
              section('wan.title', [
                wanReferenceField,
                field('field.egress', wanEgress, 'hint.egress'),
                field('field.sourceIP', wanSource, 'hint.sourceIP'),
                field('field.redirect', redirectMode, 'hint.redirect')
              ]),
              section('services.title', [
                checkboxField('field.dhcpv4', dhcpv4Enabled, 'hint.dhcpv4'),
                field('field.dnsMode', dnsMode, 'hint.dnsMode'),
                dnsServersField,
                dhcpv4PoolStartField,
                dhcpv4PoolEndField
              ], 'lan-service-section')
            ]),
            actions([
              saveButton,
              loadButton,
              applyButton,
              teardownButton,
              refreshButton
            ])
          ], { className: 'lan-config-card' }),
          F.h('div', { className: 'lan-output-grid' }, [
            F.card([
              textNode('h2', { className: F.classes.title }, 'lastStatus.title'),
              stateBody
            ], { className: 'lan-output-card' }),
            F.card([
              textNode('h2', { className: F.classes.title }, 'plan.title'),
              planBody
            ], { className: 'lan-output-card' })
          ]),
          F.card([
            F.h('div', null, [
              textNode('h2', { className: F.classes.title }, 'traffic.title'),
              textNode('p', { className: F.classes.description }, 'traffic.desc')
            ]),
            trafficBody
          ])
        ])
      ]);

      document.body.replaceChildren(page);
      syncAddressServiceFields();
      loadProfile({ silent: true }).catch(function (e) { F.toastError(e); }).finally(F.requestResize);
      const trafficTimer = window.setInterval(function () {
        if (document.visibilityState !== 'hidden' && !lanPicker.isNew()) {
          loadTraffic({ key: lanPicker.value(), silent: true });
        }
      }, 5000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && !lanPicker.isNew()) {
          loadTraffic({ key: lanPicker.value(), silent: true });
        }
      });
      window.addEventListener('pagehide', function () {
        window.clearInterval(trafficTimer);
      });
    })();
  </script>
</body>
</html>
