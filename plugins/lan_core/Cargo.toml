[package]
name = "veer-plugin-lan-core"
version = "1.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Protocol-neutral LAN adapter: bridge, DHCPv4, DNS, Egress NAT and routed IPv6 delegated prefixes"

[lib]
name = "lan_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin" }

[dev-dependencies]
veer-plugin = { path = "../../sdk/native/rust/veer-plugin", features = ["testing"] }
