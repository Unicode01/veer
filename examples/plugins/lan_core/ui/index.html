<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Core</title>
  <style>
    .lan-page {
      padding: 8px;
    }
    .lan-hero {
      padding: 11px 12px;
    }
    .lan-hero .fwd-toolbar {
      align-items: flex-start;
    }
    .lan-title-row {
      min-width: 0;
    }
    .lan-badges {
      justify-content: flex-end;
    }
    .lan-overview {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .lan-config-card {
      display: grid;
      gap: 12px;
    }
    .lan-config-card > * + * {
      margin-top: 0;
    }
    .lan-section-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .lan-form-section {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--fwd-border);
      border-radius: 9px;
      background: color-mix(in srgb, var(--fwd-surface-soft) 72%, transparent);
    }
    .lan-form-section > * + * {
      margin-top: 10px;
    }
    .lan-section-title {
      margin: 0;
      color: var(--fwd-text);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 760;
    }
    .lan-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 10px;
      align-items: end;
    }
    .lan-field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      color: var(--fwd-muted);
      font-size: 11px;
      font-weight: 650;
    }
    .lan-field-label > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lan-hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      border: 1px solid var(--fwd-border);
      border-radius: 999px;
      color: var(--fwd-soft);
      background: var(--fwd-surface);
      font-size: 10px;
      font-weight: 800;
      cursor: help;
    }
    .lan-check-field {
      min-height: 31px;
      padding: 5px 8px;
      border: 1px solid var(--fwd-border);
      border-radius: 8px;
      background: var(--fwd-surface);
    }
    .lan-check-field label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lan-check-field .fwd-input[type="checkbox"] {
      flex: 0 0 auto;
    }
    .lan-actions {
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }
    .lan-output-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .lan-output-card {
      min-height: 68px;
    }
    @media (max-width: 880px) {
      .lan-section-grid,
      .lan-output-grid,
      .lan-overview {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 620px) {
      .lan-form-grid {
        grid-template-columns: 1fr;
      }
      .lan-actions .fwd-button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <script>
    (function () {
      const F = window.ForwardPluginHost;
      if (!F) {
        document.body.textContent = 'ForwardPluginHost is not available.';
        return;
      }

      const messages = {
        'zh-CN': {
          'status.idle': '空闲',
          'status.saving': '保存中',
          'status.saved': '已保存',
          'status.saveFailed': '保存失败',
          'status.applying': '应用中',
          'status.applied': '已应用',
          'status.applyFailed': '应用失败',
          'status.disabling': '禁用中',
          'status.disabled': '已禁用',
          'status.disableFailed': '禁用失败',
          'title': 'LAN Core',
          'desc': '创建或管理 Linux bridge，记录插件托管的 LAN 口，配置网关地址，并生成给核心数据面消费的出站 NAT 配置。',
          'badge.netAdmin': 'net.admin',
          'badge.bridge': 'bridge',
          'stat.bridge': 'Bridge',
          'stat.bridge.detail': '插件创建的系统可见 LAN bridge。',
          'stat.ports': '端口',
          'stat.ports.value': '托管',
          'stat.ports.detail': '只有本插件实际加入的端口会在拆除时移除。',
          'stat.coreNat': '出站 NAT',
          'stat.coreNat.value': '核心接入',
          'stat.coreNat.detail': '核心运行时消费生成的出站 NAT 配置，不改写已保存规则。',
          'profile.title': 'LAN 配置',
          'wan.title': 'WAN 出口',
          'lastStatus.title': '最后状态',
          'plan.title': '生成的出站 NAT 配置',
          'field.lanID': 'LAN ID',
          'field.bridge': 'Bridge',
          'field.ports': 'LAN 端口',
          'field.addresses': '网关 CIDR',
          'field.mtu': 'MTU',
          'field.autoNat': '自动接入出站 NAT',
          'field.wanRef': 'WAN Ref',
          'field.egress': '出口接口',
          'field.sourceIP': '源 IP',
          'field.redirect': 'Redirect Mode',
          'hint.bridge': 'Forward core 可见的 Linux bridge，例如 br-lan。',
          'hint.ports': '逗号分隔的物理、tap 或 veth 接口。除非本插件加入，否则保留已有 bridge 成员。',
          'hint.addresses': '逗号分隔的 bridge 地址。',
          'hint.autoNat': '只在 WAN 出口可解析时启用生成的出站 NAT 配置。',
          'hint.wanRef': '逻辑 wan_core 配置引用。',
          'hint.egress': '可选覆盖。留空时按 WAN Ref 从 wan_core 状态解析。',
          'hint.sourceIP': '可选源 IP 覆盖。留空可继承 wan_core IPv4 metadata。',
          'hint.redirect': '留空使用普通 TC。prepared_l2 只用于已验证的宿主命名空间 veth handoff peer。',
          'action.save': '保存配置',
          'action.load': '加载配置',
          'action.apply': '应用网络',
          'action.teardown': '拆除',
          'action.refresh': '刷新状态',
          'json.raw': '原始 JSON',
          'empty.status': '还没有已应用的 LAN 状态。',
          'empty.plan': '还没有生成出站 NAT 配置。',
          'toast.saved': 'LAN 配置已保存。',
          'toast.loaded': 'LAN 配置已加载。',
          'toast.applied': 'LAN bridge 已应用。',
          'toast.disabled': 'LAN 网络已禁用。',
          'stat.phase': '阶段',
          'stat.statusBridge': 'Bridge',
          'stat.statusPorts': '端口',
          'stat.wanRef': 'WAN Ref',
          'stat.statusMtu': 'MTU',
          'stat.updated': '更新时间',
          'stat.enabled': '启用',
          'stat.parent': '父接口',
          'stat.out': '出口',
          'stat.redirect': 'Redirect',
          'value.yes': '是',
          'value.no': '否'
        },
        'en-US': {
          'status.idle': 'Idle',
          'status.saving': 'Saving',
          'status.saved': 'Saved',
          'status.saveFailed': 'Save failed',
          'status.applying': 'Applying',
          'status.applied': 'Applied',
          'status.applyFailed': 'Apply failed',
          'status.disabling': 'Disabling',
          'status.disabled': 'Disabled',
          'status.disableFailed': 'Disable failed',
          'title': 'LAN Core',
          'desc': 'Creates or manages a Linux bridge, records plugin-managed LAN ports, assigns gateway addresses, and emits outbound NAT config for the core dataplane.',
          'badge.netAdmin': 'net.admin',
          'badge.bridge': 'bridge',
          'stat.bridge': 'Bridge',
          'stat.bridge.detail': 'System-visible LAN bridge created by this plugin.',
          'stat.ports': 'Ports',
          'stat.ports.value': 'managed',
          'stat.ports.detail': 'Only ports actually attached by this plugin are detached on teardown.',
          'stat.coreNat': 'Outbound NAT',
          'stat.coreNat.value': 'core handoff',
          'stat.coreNat.detail': 'Core consumes the generated outbound NAT config at runtime without mutating saved rules.',
          'profile.title': 'LAN Profile',
          'wan.title': 'WAN Egress',
          'lastStatus.title': 'Last Status',
          'plan.title': 'Generated Outbound NAT',
          'field.lanID': 'LAN ID',
          'field.bridge': 'Bridge',
          'field.ports': 'LAN Ports',
          'field.addresses': 'Gateway CIDRs',
          'field.mtu': 'MTU',
          'field.autoNat': 'Auto Outbound NAT',
          'field.wanRef': 'WAN Ref',
          'field.egress': 'Egress Interface',
          'field.sourceIP': 'Source IP',
          'field.redirect': 'Redirect Mode',
          'hint.bridge': 'Linux bridge visible to Forward core, e.g. br-lan.',
          'hint.ports': 'Comma-separated physical, tap, or veth interfaces. Existing bridge members are preserved unless this plugin attached them.',
          'hint.addresses': 'Comma-separated bridge addresses.',
          'hint.autoNat': 'Enable generated outbound NAT only when WAN egress is known.',
          'hint.wanRef': 'Logical wan_core profile reference.',
          'hint.egress': 'Optional override. Leave blank to resolve from wan_core status by WAN Ref.',
          'hint.sourceIP': 'Optional source IP override. Blank can inherit wan_core IPv4 metadata.',
          'hint.redirect': 'Leave blank for normal TC. Use prepared_l2 only for verified veth handoff peers in the host namespace.',
          'action.save': 'Save Profile',
          'action.load': 'Load Profile',
          'action.apply': 'Apply Network',
          'action.teardown': 'Teardown',
          'action.refresh': 'Refresh Status',
          'json.raw': 'Raw JSON',
          'empty.status': 'No applied LAN status yet.',
          'empty.plan': 'No generated outbound NAT config yet.',
          'toast.saved': 'LAN profile saved.',
          'toast.loaded': 'LAN profile loaded.',
          'toast.applied': 'LAN bridge applied.',
          'toast.disabled': 'LAN network disabled.',
          'stat.phase': 'Phase',
          'stat.statusBridge': 'Bridge',
          'stat.statusPorts': 'Ports',
          'stat.wanRef': 'WAN Ref',
          'stat.statusMtu': 'MTU',
          'stat.updated': 'Updated',
          'stat.enabled': 'Enabled',
          'stat.parent': 'Parent',
          'stat.out': 'Out',
          'stat.redirect': 'Redirect',
          'value.yes': 'yes',
          'value.no': 'no'
        }
      };

      const textBindings = [];
      const attrBindings = [];
      let statusKey = 'status.idle';
      let lastStatusData = null;
      let lastPlanData = null;

      function T(key, params) {
        return F.t(messages, key, params);
      }

      function bindText(node, key, params) {
        node.textContent = T(key, params);
        textBindings.push({ node, key, params });
        return node;
      }

      function bindPrefixedText(node, prefix, key, params) {
        node.textContent = String(prefix || '') + T(key, params);
        textBindings.push({ node, prefix: String(prefix || ''), key, params });
        return node;
      }

      function bindAttr(node, attr, key, params) {
        node.setAttribute(attr, T(key, params));
        attrBindings.push({ node, attr, key, params });
        return node;
      }

      function textNode(tag, opts, key, params) {
        return bindText(F.h(tag, opts || {}), key, params);
      }

      function i18nButton(key, handler, secondary) {
        return bindText(F.button(T(key), handler, secondary), key);
      }

      function setStatus(key) {
        statusKey = key;
        status.textContent = T(key);
      }

      function refreshI18n() {
        textBindings.forEach((item) => {
          item.node.textContent = (item.prefix || '') + T(item.key, item.params);
        });
        attrBindings.forEach((item) => {
          item.node.setAttribute(item.attr, T(item.key, item.params));
        });
        status.textContent = T(statusKey);
        renderStatus();
        renderPlan();
        F.requestResize();
      }

      const status = F.status(T('status.idle'));
      const stateBody = F.h('div', { className: F.classes.stack });
      const planBody = F.h('div', { className: F.classes.stack });
      const lanID = input('default', 'lan id');
      const bridge = input('br-lan', 'br-lan');
      const ports = input('', 'eth1, eth2, eth3');
      const addresses = input('192.168.100.1/24', '192.168.100.1/24, fd00:100::1/64');
      const mtu = input('1500', 'mtu', 'number');
      const wanRef = input('default', 'wan_core profile');
      const wanEgress = input('', 'eth0 / pppoe-wan / fwdvtap0');
      const wanSource = input('', 'optional WAN source IP');
      const redirectMode = input('', 'blank / prepared_l2');
      const autoNAT = checkbox(true);
      F.onLocaleChange(refreshI18n);

      function input(value, placeholder, type) {
        return F.h('input', {
          className: F.classes.input,
          attrs: { type: type || 'text', value, placeholder }
        });
      }

      function checkbox(checked) {
        return F.h('input', {
          className: F.classes.input,
          attrs: { type: 'checkbox', checked: !!checked }
        });
      }

      function field(labelKey, control, hintKey) {
        const labelChildren = [textNode('span', null, labelKey)];
        if (hintKey) {
          labelChildren.push(bindAttr(F.h('span', { className: 'lan-hint', text: '?' }), 'title', hintKey));
        }
        return F.h('label', { className: F.classes.field + ' lan-field' }, [
          F.h('span', { className: 'lan-field-label' }, labelChildren),
          control
        ]);
      }

      function checkboxField(labelKey, control, hintKey) {
        const label = F.h('label', null, [
          control,
          bindPrefixedText(F.h('span'), '', labelKey)
        ]);
        if (hintKey) bindAttr(label, 'title', hintKey);
        return F.h('div', { className: F.classes.field + ' lan-check-field' }, [
          label
        ]);
      }

      function section(titleKey, children) {
        return F.h('section', { className: 'lan-form-section' }, [
          textNode('h2', { className: 'lan-section-title' }, titleKey),
          F.h('div', { className: 'lan-form-grid' }, children)
        ]);
      }

      function actions(children) {
        return F.h('div', { className: F.classes.toolbar + ' lan-actions' }, children);
      }

      function setBusy(button, busy, text) {
        button.disabled = !!busy;
        if (text) button.textContent = text;
      }

      function key() {
        return lanID.value.trim() || 'default';
      }

      function csv(value) {
        return value.split(',').map((item) => item.trim()).filter(Boolean);
      }

      function payload() {
        return {
          key: key(),
          lan_id: key(),
          bridge: bridge.value.trim() || 'br-lan',
          ports: csv(ports.value),
          addresses: csv(addresses.value),
          mtu: Number(mtu.value || 1500),
          wan_ref: wanRef.value.trim() || 'default',
          wan_egress_interface: wanEgress.value.trim(),
          wan_egress_source_ip: wanSource.value.trim(),
          redirect_mode: redirectMode.value.trim(),
          auto_egress_nat: autoNAT.checked
        };
      }

      async function saveProfile() {
        setStatus('status.saving');
        try {
          const p = payload();
          await F.data.upsert('profiles', key(), p, { enabled: true });
          setStatus('status.saved');
          F.toast(T('toast.saved'));
        } catch (e) {
          setStatus('status.saveFailed');
          F.toastError(e);
        } finally {
          F.requestResize();
        }
      }

      async function loadProfile() {
        try {
          const record = await F.data.get('profiles', key());
          const data = record.data || {};
          bridge.value = data.bridge || data.bridge_interface || 'br-lan';
          ports.value = Array.isArray(data.ports) ? data.ports.join(', ') : (data.ports || '');
          addresses.value = Array.isArray(data.addresses) ? data.addresses.join(', ') : (data.addresses || data.ipv4_cidr || '192.168.100.1/24');
          mtu.value = data.mtu || data.bridge_mtu || 1500;
          wanRef.value = data.wan_ref || data.wan || 'default';
          wanEgress.value = data.wan_egress_interface || data.out_interface || '';
          wanSource.value = data.wan_egress_source_ip || data.out_source_ip || '';
          redirectMode.value = data.redirect_mode || data.egress_nat_redirect_mode || '';
          autoNAT.checked = data.auto_egress_nat !== false;
          F.toast(T('toast.loaded'));
        } catch (e) {
          F.toastError(e);
        } finally {
          F.requestResize();
        }
      }

      async function apply(button) {
        setBusy(button, true, T('status.applying'));
        setStatus('status.applying');
        try {
          await saveProfile();
          await F.action('apply_network', payload());
          await loadStatus();
          setStatus('status.applied');
          F.toast(T('toast.applied'));
        } catch (e) {
          setStatus('status.applyFailed');
          F.toastError(e);
        } finally {
          setBusy(button, false, T('action.apply'));
          F.requestResize();
        }
      }

      async function teardown(button) {
        setBusy(button, true, T('status.disabling'));
        setStatus('status.disabling');
        try {
          await F.action('teardown', payload());
          await loadStatus();
          setStatus('status.disabled');
          F.toast(T('toast.disabled'));
        } catch (e) {
          setStatus('status.disableFailed');
          F.toastError(e);
        } finally {
          setBusy(button, false, T('action.teardown'));
          F.requestResize();
        }
      }

      function renderJSON(container, value) {
        container.appendChild(F.h('details', null, [
          F.h('summary', {
            className: F.classes.muted,
            text: T('json.raw')
          }),
          F.h('pre', {
            text: JSON.stringify(value || {}, null, 2),
            attrs: {
              style: 'margin:10px 0 0;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5;'
            }
          })
        ]));
      }

      function i18nStat(labelKey, value, detailKey, valueIsKey) {
        const node = F.h('div', { className: F.classes.stat }, [
          textNode('span', { className: F.classes.statLabel }, labelKey),
          valueIsKey
            ? textNode('span', { className: F.classes.statValue }, value)
            : F.h('span', { className: F.classes.statValue, text: value == null || value === '' ? '-' : String(value) })
        ]);
        if (detailKey) bindAttr(node, 'title', detailKey);
        return node;
      }

      function renderStatus() {
        stateBody.replaceChildren();
        if (!lastStatusData) {
          stateBody.appendChild(F.h('p', {
            className: F.classes.description,
            text: T('empty.status')
          }));
          return;
        }
        const data = lastStatusData;
        stateBody.appendChild(F.h('div', { className: F.classes.grid }, [
          F.stat(T('stat.phase'), data.phase || '-'),
          F.stat(T('stat.statusBridge'), data.bridge || '-'),
          F.stat(T('stat.statusPorts'), Array.isArray(data.ports) ? data.ports.length : 0),
          F.stat(T('stat.wanRef'), data.wan_ref || '-'),
          F.stat(T('stat.statusMtu'), data.bridge_mtu || data.mtu || '-'),
          F.stat(T('stat.updated'), data.updated_at || '-')
        ]));
        renderJSON(stateBody, data);
      }

      function renderPlan() {
        planBody.replaceChildren();
        if (!lastPlanData) {
          planBody.appendChild(F.h('p', {
            className: F.classes.description,
            text: T('empty.plan')
          }));
          return;
        }
        const data = lastPlanData;
        planBody.appendChild(F.h('div', { className: F.classes.grid }, [
          F.stat(T('stat.enabled'), data.enabled ? T('value.yes') : T('value.no')),
          F.stat(T('stat.parent'), data.parent_interface || '-'),
          F.stat(T('stat.out'), data.out_interface || '-'),
          F.stat(T('stat.redirect'), data.redirect_mode || '-')
        ]));
        renderJSON(planBody, data);
      }

      async function loadStatus() {
        try {
          const record = await F.data.get('status', key());
          lastStatusData = record.data || {};
        } catch (e) {
          lastStatusData = null;
        }
        renderStatus();
        try {
          const record = await F.data.get('egress_nat_plans', key());
          lastPlanData = record.data || {};
        } catch (e) {
          lastPlanData = null;
        }
        renderPlan();
        F.requestResize();
      }

      const applyButton = i18nButton('action.apply', function () { apply(applyButton); });
      const teardownButton = i18nButton('action.teardown', function () { teardown(teardownButton); }, true);
      const page = F.h('main', { className: F.classes.page + ' lan-page' }, [
        F.stack([
          F.card([
            F.h('div', { className: F.classes.toolbar }, [
              F.h('div', { className: 'lan-title-row' }, [
                textNode('h1', { className: F.classes.title }, 'title'),
                textNode('p', { className: F.classes.description }, 'desc')
              ]),
              F.h('div', { className: F.classes.toolbar + ' lan-badges' }, [
                bindText(F.badge(T('badge.netAdmin')), 'badge.netAdmin'),
                bindText(F.badge(T('badge.bridge')), 'badge.bridge'),
                status
              ])
            ])
          ], { className: 'lan-hero' }),
          F.h('div', { className: F.classes.grid + ' lan-overview' }, [
            i18nStat('stat.bridge', 'br-lan', 'stat.bridge.detail'),
            i18nStat('stat.ports', 'stat.ports.value', 'stat.ports.detail', true),
            i18nStat('stat.coreNat', 'stat.coreNat.value', 'stat.coreNat.detail', true)
          ]),
          F.card([
            F.h('div', { className: 'lan-section-grid' }, [
              section('profile.title', [
                field('field.lanID', lanID),
                field('field.bridge', bridge, 'hint.bridge'),
                field('field.ports', ports, 'hint.ports'),
                field('field.addresses', addresses, 'hint.addresses'),
                field('field.mtu', mtu),
                checkboxField('field.autoNat', autoNAT, 'hint.autoNat')
              ]),
              section('wan.title', [
                field('field.wanRef', wanRef, 'hint.wanRef'),
                field('field.egress', wanEgress, 'hint.egress'),
                field('field.sourceIP', wanSource, 'hint.sourceIP'),
                field('field.redirect', redirectMode, 'hint.redirect')
              ])
            ]),
            actions([
              i18nButton('action.save', saveProfile),
              i18nButton('action.load', loadProfile, true),
              applyButton,
              teardownButton,
              i18nButton('action.refresh', loadStatus, true)
            ])
          ], { className: 'lan-config-card' }),
          F.h('div', { className: 'lan-output-grid' }, [
            F.card([
              textNode('h2', { className: F.classes.title }, 'lastStatus.title'),
              stateBody
            ], { className: 'lan-output-card' }),
            F.card([
              textNode('h2', { className: F.classes.title }, 'plan.title'),
              planBody
            ], { className: 'lan-output-card' })
          ])
        ])
      ]);

      document.body.replaceChildren(page);
      loadStatus().finally(F.requestResize);
    })();
  </script>
</body>
</html>
