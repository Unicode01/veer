<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTap To Local</title>
</head>
<body>
  <script>
    (function () {
      const F = window.ForwardPluginHost;
      if (!F) {
        document.body.textContent = 'ForwardPluginHost is not available.';
        return;
      }

      const messages = {
        'zh-CN': {
          'status.idle': '空闲',
          'status.saving': '保存中',
          'status.saved': '已保存',
          'status.saveFailed': '保存失败',
          'status.applying': '应用中',
          'status.applied': '已应用',
          'status.applyFailed': '应用失败',
          'status.deleting': '删除中',
          'status.deleted': '已删除',
          'status.deleteFailed': '删除失败',
          'title': 'VTap To Local',
          'desc': '为宿主本机发起的流量创建真实 veth ingress pair。应用后可把 Forward Egress NAT 配置到 vtap peer 接口。',
          'badge.netAdmin': 'net.admin',
          'badge.veth': 'veth',
          'stat.handoff': 'Handoff',
          'stat.handoff.value': 'host veth -> peer ingress',
          'stat.handoff.detail': '把本机流量路由到宿主侧 veth；fvtap 挂在 peer 侧。',
          'stat.coreRule': '核心规则',
          'stat.coreRule.value': 'Egress NAT',
          'stat.coreRule.detail': '把 peer 接口作为父接口/入口 scope。',
          'stat.routesTop': '路由',
          'stat.routesTop.value': '仅显式配置',
          'stat.routesTop.detail': '除非配置路由，否则插件不会接管默认路由。',
          'profile.title': '配置',
          'lastStatus.title': '最后状态',
          'field.profile': '配置',
          'field.hostInterface': '宿主接口',
          'field.vtapPeer': 'VTap Peer 接口',
          'field.mtu': 'MTU',
          'field.hostCIDR': '宿主 CIDR',
          'field.peerCIDR': 'Peer CIDR',
          'field.routes': 'Routes JSON',
          'action.save': '保存配置',
          'action.load': '加载配置',
          'action.apply': '应用',
          'action.teardown': '拆除',
          'action.refresh': '刷新状态',
          'toast.saved': 'VToLocal 配置已保存。',
          'toast.loaded': '配置已加载。',
          'toast.applied': 'Veth handoff 已应用。',
          'toast.deleted': 'Veth pair 已删除。',
          'empty.status': '还没有已应用状态。',
          'error.routesArray': 'routes 必须是 JSON 数组',
          'stat.phase': '阶段',
          'stat.host': '宿主',
          'stat.vtapPeer': 'VTap Peer',
          'stat.routes': '路由',
          'stat.egressParent': 'Egress NAT 父接口',
          'stat.updated': '更新时间'
        },
        'en-US': {
          'status.idle': 'Idle',
          'status.saving': 'Saving',
          'status.saved': 'Saved',
          'status.saveFailed': 'Save failed',
          'status.applying': 'Applying',
          'status.applied': 'Applied',
          'status.applyFailed': 'Apply failed',
          'status.deleting': 'Deleting',
          'status.deleted': 'Deleted',
          'status.deleteFailed': 'Delete failed',
          'title': 'VTap To Local',
          'desc': 'Creates a real veth ingress pair for host-originated traffic. Configure Forward Egress NAT against the vtap peer interface after applying.',
          'badge.netAdmin': 'net.admin',
          'badge.veth': 'veth',
          'stat.handoff': 'Handoff',
          'stat.handoff.value': 'host veth -> peer ingress',
          'stat.handoff.detail': 'Route local traffic to the host-side veth; fvtap attaches on the peer.',
          'stat.coreRule': 'Core Rule',
          'stat.coreRule.value': 'Egress NAT',
          'stat.coreRule.detail': 'Use the peer interface as the parent/inbound scope.',
          'stat.routesTop': 'Routes',
          'stat.routesTop.value': 'explicit only',
          'stat.routesTop.detail': 'This plugin does not take over the default route unless configured.',
          'profile.title': 'Profile',
          'lastStatus.title': 'Last Status',
          'field.profile': 'Profile',
          'field.hostInterface': 'Host Interface',
          'field.vtapPeer': 'VTap Peer Interface',
          'field.mtu': 'MTU',
          'field.hostCIDR': 'Host CIDR',
          'field.peerCIDR': 'Peer CIDR',
          'field.routes': 'Routes JSON',
          'action.save': 'Save Profile',
          'action.load': 'Load Profile',
          'action.apply': 'Apply',
          'action.teardown': 'Teardown',
          'action.refresh': 'Refresh Status',
          'toast.saved': 'VToLocal profile saved.',
          'toast.loaded': 'Profile loaded.',
          'toast.applied': 'Veth handoff applied.',
          'toast.deleted': 'Veth pair deleted.',
          'empty.status': 'No applied status yet.',
          'error.routesArray': 'routes must be a JSON array',
          'stat.phase': 'Phase',
          'stat.host': 'Host',
          'stat.vtapPeer': 'VTap Peer',
          'stat.routes': 'Routes',
          'stat.egressParent': 'Egress NAT Parent',
          'stat.updated': 'Updated'
        }
      };

      const textBindings = [];
      const attrBindings = [];
      let statusKey = 'status.idle';
      let lastStatusData = null;

      function T(key, params) {
        return F.t(messages, key, params);
      }

      function bindText(node, key, params) {
        node.textContent = T(key, params);
        textBindings.push({ node, key, params });
        return node;
      }

      function bindAttr(node, attr, key, params) {
        node.setAttribute(attr, T(key, params));
        attrBindings.push({ node, attr, key, params });
        return node;
      }

      function textNode(tag, opts, key, params) {
        return bindText(F.h(tag, opts || {}), key, params);
      }

      function i18nButton(key, handler, secondary) {
        return bindText(F.button(T(key), handler, secondary), key);
      }

      function setStatus(key) {
        statusKey = key;
        status.textContent = T(key);
      }

      function refreshI18n() {
        textBindings.forEach((item) => {
          item.node.textContent = T(item.key, item.params);
        });
        attrBindings.forEach((item) => {
          item.node.setAttribute(item.attr, T(item.key, item.params));
        });
        status.textContent = T(statusKey);
        renderStatus();
        F.requestResize();
      }

      const status = F.status(T('status.idle'));
      const stateBody = F.h('div', { className: F.classes.stack });
      const profileKey = input('default', 'profile key');
      const hostInterface = input('fwdlocal0', 'host-side veth');
      const vtapInterface = input('fwdvtap0', 'fvtap ingress peer');
      const mtu = input('1492', 'mtu', 'number');
      const hostCIDR = input('169.254.253.1/30', 'host cidr');
      const vtapCIDR = input('169.254.253.2/30', 'vtap cidr');
      const routes = F.h('textarea', {
        className: F.classes.input,
        attrs: {
          rows: '4',
          placeholder: '[{"dst":"198.51.100.0/24","dev":"fwdlocal0","table":100,"metric":10}]'
        }
      });
      F.onLocaleChange(refreshI18n);

      function input(value, placeholder, type) {
        return F.h('input', {
          className: F.classes.input,
          attrs: { type: type || 'text', value, placeholder }
        });
      }

      function field(labelKey, control) {
        return F.h('label', { className: F.classes.field }, [
          textNode('span', null, labelKey),
          control
        ]);
      }

      function setBusy(button, busy, text) {
        button.disabled = !!busy;
        if (text) button.textContent = text;
      }

      function payload() {
        return {
          profile_key: profileKey.value.trim() || 'default',
          host_interface: hostInterface.value.trim() || 'fwdlocal0',
          vtap_interface: vtapInterface.value.trim() || 'fwdvtap0',
          mtu: Number(mtu.value || 1492),
          host_addresses: hostCIDR.value.trim() ? [hostCIDR.value.trim()] : [],
          vtap_addresses: vtapCIDR.value.trim() ? [vtapCIDR.value.trim()] : [],
          routes: parseRoutes()
        };
      }

      function parseRoutes() {
        const text = routes.value.trim();
        if (!text) return [];
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) throw new Error(T('error.routesArray'));
        return parsed;
      }

      async function saveProfile() {
        setStatus('status.saving');
        try {
          const p = payload();
          await F.data.upsert('links', p.profile_key, p, { enabled: true });
          setStatus('status.saved');
          F.toast(T('toast.saved'));
        } catch (e) {
          setStatus('status.saveFailed');
          F.toastError(e);
        } finally {
          F.requestResize();
        }
      }

      async function loadProfile() {
        try {
          const key = profileKey.value.trim() || 'default';
          const record = await F.data.get('links', key);
          const data = record.data || {};
          hostInterface.value = data.host_interface || 'fwdlocal0';
          vtapInterface.value = data.vtap_interface || 'fwdvtap0';
          mtu.value = data.mtu || 1492;
          hostCIDR.value = Array.isArray(data.host_addresses) ? (data.host_addresses[0] || '') : (data.host_cidr || data.host_ipv4_cidr || '');
          vtapCIDR.value = Array.isArray(data.vtap_addresses) ? (data.vtap_addresses[0] || '') : (data.vtap_cidr || data.vtap_ipv4_cidr || '');
          routes.value = JSON.stringify(Array.isArray(data.routes) ? data.routes : [], null, 2);
          F.toast(T('toast.loaded'));
        } catch (e) {
          F.toastError(e);
        } finally {
          F.requestResize();
        }
      }

      async function apply(button) {
        setBusy(button, true, T('status.applying'));
        setStatus('status.applying');
        try {
          await F.action('apply', payload());
          await loadStatus();
          setStatus('status.applied');
          F.toast(T('toast.applied'));
        } catch (e) {
          setStatus('status.applyFailed');
          F.toastError(e);
        } finally {
          setBusy(button, false, T('action.apply'));
          F.requestResize();
        }
      }

      async function teardown(button) {
        setBusy(button, true, T('status.deleting'));
        setStatus('status.deleting');
        try {
          await F.action('teardown', payload());
          await loadStatus();
          setStatus('status.deleted');
          F.toast(T('toast.deleted'));
        } catch (e) {
          setStatus('status.deleteFailed');
          F.toastError(e);
        } finally {
          setBusy(button, false, T('action.teardown'));
          F.requestResize();
        }
      }

      function i18nStat(labelKey, value, detailKey, valueIsKey) {
        const node = F.h('div', { className: F.classes.stat }, [
          textNode('span', { className: F.classes.statLabel }, labelKey),
          valueIsKey
            ? textNode('span', { className: F.classes.statValue }, value)
            : F.h('span', { className: F.classes.statValue, text: value == null || value === '' ? '-' : String(value) })
        ]);
        if (detailKey) bindAttr(node, 'title', detailKey);
        return node;
      }

      function renderStatus() {
        stateBody.replaceChildren();
        if (!lastStatusData) {
          stateBody.appendChild(F.h('p', {
            className: F.classes.description,
            text: T('empty.status')
          }));
          return;
        }
        const data = lastStatusData;
        stateBody.appendChild(F.h('div', { className: F.classes.grid }, [
          F.stat(T('stat.phase'), data.phase || '-'),
          F.stat(T('stat.host'), (data.host_interface || '-') + ' #' + (data.host_ifindex || '-')),
          F.stat(T('stat.vtapPeer'), (data.vtap_interface || '-') + ' #' + (data.vtap_ifindex || '-')),
          F.stat(T('stat.routes'), data.route_count == null ? '-' : data.route_count),
          F.stat(T('stat.egressParent'), data.egress_nat_parent_interface || '-'),
          F.stat(T('stat.updated'), data.updated_at || '-')
        ]));
      }

      async function loadStatus() {
        try {
          const key = profileKey.value.trim() || 'default';
          const record = await F.data.get('status', key);
          lastStatusData = record.data || {};
        } catch (e) {
          lastStatusData = null;
        } finally {
          renderStatus();
          F.requestResize();
        }
      }

      const applyButton = i18nButton('action.apply', function () { apply(applyButton); });
      const teardownButton = i18nButton('action.teardown', function () { teardown(teardownButton); }, true);
      const page = F.h('main', { className: F.classes.page }, [
        F.stack([
          F.card([
            F.h('div', { className: F.classes.toolbar }, [
              F.h('div', null, [
                textNode('h1', { className: F.classes.title }, 'title'),
                textNode('p', { className: F.classes.description }, 'desc')
              ]),
              F.h('div', { className: F.classes.toolbar }, [
                bindText(F.badge(T('badge.netAdmin')), 'badge.netAdmin'),
                bindText(F.badge(T('badge.veth')), 'badge.veth'),
                status
              ])
            ])
          ]),
          F.h('div', { className: F.classes.grid }, [
            i18nStat('stat.handoff', 'stat.handoff.value', 'stat.handoff.detail', true),
            i18nStat('stat.coreRule', 'stat.coreRule.value', 'stat.coreRule.detail', true),
            i18nStat('stat.routesTop', 'stat.routesTop.value', 'stat.routesTop.detail', true)
          ]),
          F.card([
            textNode('h2', { className: F.classes.title }, 'profile.title'),
            F.h('div', { className: F.classes.grid }, [
              field('field.profile', profileKey),
              field('field.hostInterface', hostInterface),
              field('field.vtapPeer', vtapInterface),
              field('field.mtu', mtu),
              field('field.hostCIDR', hostCIDR),
              field('field.peerCIDR', vtapCIDR)
            ]),
            field('field.routes', routes),
            F.h('div', { className: F.classes.toolbar }, [
              i18nButton('action.save', saveProfile),
              i18nButton('action.load', loadProfile, true),
              applyButton,
              teardownButton,
              i18nButton('action.refresh', loadStatus, true)
            ])
          ]),
          F.card([
            textNode('h2', { className: F.classes.title }, 'lastStatus.title'),
            stateBody
          ])
        ])
      ]);

      document.body.replaceChildren(page);
      loadStatus().finally(F.requestResize);
    })();
  </script>
</body>
</html>
